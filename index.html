<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#313133"><title>Triad Bar</title>
<style>
:root{color-scheme:dark;--bg:#313133;--panel:#0d111a;--blue:#438bff;--fg:#f5f8ff;--cell:34px;--cw:22px;--font:15px;--line:1px;--bar-bg:linear-gradient(160deg,#1c2436 0%,#161d2d 100%);--pad:8px}

*{box-sizing:border-box}
html,body{touch-action:none;overscroll-behavior:none;margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{width:100%;height:100%;background:var(--bg)}

.key-wheel-wrap{display:none!important;position:fixed;z-index:30;left:50%;top:calc(50% - 86.25px);bottom:auto;transform:translateX(-50%);width:172.5px;display:flex;flex-direction:column;align-items:stretch;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.key-wheel-wrap.dragging{cursor:grabbing}

.mode-indicator{display:none!important}

.bars-area{position:fixed;inset:0;z-index:10;pointer-events:none}
.bar-wrap{position:fixed;width:calc(100% - 16px);left:8px;right:auto;touch-action:none;pointer-events:auto;user-select:none;-webkit-user-select:none}
#bottomWrap{top:56px}
.chord-labels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));width:100%;height:30px;align-items:center;margin-bottom:2px;color:#6cc4ff;font-size:var(--font);font-weight:500;text-align:center;line-height:1}
.chord-label{display:block;min-width:0;width:100%;height:100%;position:relative;overflow:visible;white-space:nowrap}
.label-root-acc{position:absolute;left:25%;top:50%;margin-left:0;transform:translateY(-50%);display:inline-flex;align-items:center;justify-content:flex-start;white-space:nowrap}
.label-root{display:inline-block;flex:0 0 auto;width:auto;text-align:left;line-height:1}
.label-acc{display:inline-block;line-height:1;margin-left:.02em}
.label-acc:empty{margin-left:0}
.label-suffix{display:inline-block;font-size:.9em;line-height:1;white-space:nowrap;margin-left:.03em}
.sus-word{font-size:calc(1em - 3px)}
.sus-num{line-height:1;font-size:calc(1em - 4px)}
.label-suffix.compact-altered-sus{font-size:.9em}
/* A sus chord with an added 7 / maj7 / 6 / 9 / 11 / 13 (M11sus2, 7sus, 6sus2 ...): the whole name is the size of the "sus" in the plain sus labels (3px under the label text) - top labels, note bar headings and the quality box. */
.label-suffix.sus-combo{font-size:calc(.9em - 3px)!important}
.quality-text .sus-combo{font-size:calc(1em - 3px)}
.triad-bar{display:grid;width:100%;background:var(--bar-bg);border:calc(2*var(--line)) solid var(--blue);/* outside line 2x */border-radius:9px;overflow:hidden;grid-template-columns:repeat(var(--groups),minmax(0,1fr));}

.triad-group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-width:0;border-right:calc(2*var(--line)) solid var(--blue)} /* line between chords is 2x; the line between a note and its accidental column stays normal */
.triad-group:last-child{border-right:0}
.note-stack,.acc-stack{display:grid;grid-template-rows:repeat(var(--rows,3),var(--cell));min-width:0}
.note-stack{border-right:var(--line) solid var(--blue)}
.acc-stack{border-right:0}
.triad-cell{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;white-space:nowrap;font-size:var(--font);line-height:1;font-weight:500;border-bottom:var(--line) solid var(--blue);color:var(--fg);padding:0 1px}
.triad-cell:last-child{border-bottom:0}
.acc-stack .triad-cell{font-size:var(--font)}
.blank{color:transparent!important}
.double-accidental{color:#7b808b!important} /* double-accidental notes are dark grey: red is now the circle-of-fifths colour of C */
@media(max-width:390px){.motion-indicator .formula-cell{font-size:calc(var(--font)*.8)!important}.bars-area{gap:14px}.triad-cell{padding:0}.acc-stack .triad-cell{font-size:var(--font)}}

.swipe-pad{position:fixed;right:18px;top:calc(50% - 70px);transform:none;width:154px;height:160px;display:grid;grid-template-columns:repeat(4,34px);grid-template-rows:repeat(4,34px);justify-content:center;align-content:center;column-gap:6px;row-gap:8px;z-index:35;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}

.swipe-btn{position:relative;justify-self:center;align-self:center;width:34px;height:34px;background:linear-gradient(145deg,rgba(120,162,255,.42) 0%,rgba(77,126,232,.16) 52%,rgba(53,102,200,.3) 100%);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border:1px solid rgba(170,200,255,.45);border-radius:11px;padding:0;margin:0;outline:none;display:flex;align-items:center;justify-content:center;color:#fff;line-height:1;font-family:Arial,sans-serif;box-shadow:inset 2px 2px 4px #ffffff55,inset -3px -3px 5px #183d8d88,0 6px 10px #0008;transition:transform .08s,box-shadow .08s}

.swipe-btn:active{transform:translateY(3px);box-shadow:inset 2px 2px 4px #ffffff44,inset -2px -2px 4px #183d8d88,0 3px 6px #0008}

.swipe-btn.active,.swipe-btn.active:active{z-index:3;border-color:#438bff;box-shadow:0 0 0 2px #438bff,0 10px 18px rgba(0,0,0,.95),0 3px 6px rgba(0,0,0,.9)}

.motion-indicator{position:absolute;left:calc(50% - var(--cell));top:calc(-3 * var(--cell) - 11px);width:calc(2 * var(--cell));height:calc(3 * var(--cell));display:grid;grid-template-columns:repeat(2,var(--cell));grid-template-rows:repeat(3,var(--cell));background:var(--bar-bg);border:var(--line) solid var(--blue);border-radius:9px;overflow:hidden;box-shadow:none;pointer-events:none}
.motion-cell{display:flex;align-items:center;justify-content:center;border-right:var(--line) solid var(--blue);border-bottom:var(--line) solid var(--blue);color:#fff;font-size:22px;font-weight:800;line-height:1;text-shadow:none;min-width:0;min-height:0}
.motion-square{display:inline-block;box-sizing:border-box;width:.7em;height:.14em;border:0;border-radius:0;background:#fff}
.motion-triangle-pair{display:inline-flex;align-items:center;justify-content:center;gap:0;max-width:100%;white-space:nowrap}
.motion-triangle{display:inline-block;font-size:15px;line-height:1;font-weight:900;transform:scaleX(.95);flex:0 0 auto;color:#fff}
.motion-cell.double-motion,.formula-cell.double-motion,.double-motion .motion-triangle{color:var(--blue)!important}
.motion-arrow-cell{grid-column:2;border-right:0}
.formula-cell{grid-column:1;font-family:inherit;font-size:calc(var(--font)*.86)!important;font-weight:500!important;line-height:1;border-right:var(--line) solid var(--blue)}
.motion-middle{font-size:21px}
.swipe-btn.sus2{grid-column:1;grid-row:4}
.swipe-btn.sus4{grid-column:3;grid-row:1}
.swipe-btn.aug{grid-column:2;grid-row:1}
.swipe-btn.dim{grid-column:2;grid-row:4}
.swipe-btn .btn-label{position:relative;z-index:1;display:block;text-align:center;color:#fff;font-size:15px;font-weight:800;line-height:1;letter-spacing:0;white-space:nowrap;pointer-events:none;text-shadow:0 2px 2px #16336bcc}

.swipe-btn.up{left:auto;right:auto;top:auto;bottom:auto;grid-column:2;grid-row:2}

.swipe-btn.down{left:auto;right:auto;top:auto;bottom:auto;grid-column:2;grid-row:3}

.swipe-btn.left{left:auto;right:auto;top:auto;bottom:auto;grid-column:1;grid-row:2 / span 2;height:auto;align-self:stretch}

.swipe-btn.right{left:auto;right:auto;top:auto;bottom:auto;grid-column:3;grid-row:2 / span 2;height:auto;align-self:stretch}

.reset-btn{position:relative;left:0;top:-3px;justify-self:center;align-self:center;grid-column:3;grid-row:4;width:39px;height:39px;border-radius:50%;border:1px solid rgba(170,200,255,.45);background:linear-gradient(145deg,rgba(100,140,210,.4),rgba(40,60,100,.22));color:#dce7ff;font-size:10px;font-weight:800;line-height:1;box-shadow:inset 2px 2px 4px #ffffff22,inset -3px -3px 5px #0008,0 3px 0 #080d17,0 5px 9px #0008;cursor:pointer}

.practical-btn{z-index:50;pointer-events:auto;touch-action:manipulation;position:relative;left:-39px;top:-3px;justify-self:center;align-self:center;grid-column:3;grid-row:4;width:39px;height:39px;border-radius:50%;border:1px solid rgba(170,200,255,.45);background:linear-gradient(145deg,rgba(100,140,210,.4),rgba(40,60,100,.22));color:#dce7ff;font-size:10px;font-weight:800;line-height:1;box-shadow:inset 2px 2px 4px #ffffff22,inset -3px -3px 5px #0008,0 3px 0 #080d17,0 5px 9px #0008;cursor:pointer}
.practical-btn.active{border-color:#ffd27a;box-shadow:0 0 0 .5px #ffd27a}
.practical-btn:active{transform:translateY(2px)}

.set-btn{position:relative;left:39px;top:-3px;justify-self:center;align-self:center;grid-column:3;grid-row:4;width:39px;height:39px;border-radius:50%;border:1px solid rgba(170,200,255,.45);background:linear-gradient(145deg,rgba(100,140,210,.4),rgba(40,60,100,.22));color:#dce7ff;font-size:16px;font-weight:800;line-height:1;box-shadow:inset 2px 2px 4px #ffffff22,inset -3px -3px 5px #0008,0 3px 0 #080d17,0 5px 9px #0008;cursor:pointer}

.reset-btn:active,.set-btn:active{transform:translateY(2px);box-shadow:inset 2px 2px 4px #ffffff18,inset -2px -2px 4px #0008,0 1px 0 #080d17,0 3px 6px #0008}

/* CoF wheel and chart drag handle. Keep the wheel at its original 172.5px canvas size. */
.key-wheel-wrap{display:flex!important;width:172.5px;height:172.5px;position:fixed;z-index:30;left:50%;top:calc(50% - 86.25px);bottom:auto;transform:translateX(-50%);align-items:stretch;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;filter:drop-shadow(0 9px 15px #000b)}

.key-wheel-wrap.dragging,.swipe-pad.dragging{cursor:grabbing}

.motion-indicator{pointer-events:auto;cursor:grab}

.swipe-pad{cursor:grab}

/* Flat wheel layout: the wheel, formula, and controls occupy separate columns. */
.key-wheel-wrap{width:224.25px;height:224.25px;left:18px;top:calc(50% - 148.6px);transform:none;filter:drop-shadow(0 12px 18px #000b)}

.motion-indicator{position:fixed;left:calc(50% + 91.7px);top:calc(50% - 124px);z-index:26;pointer-events:auto;cursor:grab}
/* In the standalone triad formula box only, rotate movement triangles to horizontal. */
#motionIndicator .motion-triangle{transform:rotate(90deg) scaleX(.95)}

/* Default layout: bar on top, wheel left, formula box right of the wheel, button pad centred below the wheel. */
.swipe-pad{left:calc(50% - 60px);right:auto;top:calc(50% + 120px)}
/* Circle buttons stacked vertically to the right of the pad, 8px apart and 6px from the buttons (same gaps as the pad grid). */
.swipe-pad{width:114px;grid-template-columns:repeat(3,34px);justify-content:start}
.practical-btn,.reset-btn,.set-btn{position:absolute;left:180px;grid-column:auto;grid-row:auto;justify-self:auto;align-self:auto}
.practical-btn{top:3px}
.reset-btn{top:50px}
.set-btn{top:97px}
/* Bigger, bolder symbols on the circle buttons */
.reset-btn{font-size:22px;font-weight:900;color:#fff;padding:0;text-shadow:0 1px 2px #16336bcc}
.set-btn{font-size:22px;font-weight:900;color:#fff;padding:0;text-shadow:0 1px 2px #16336bcc}
.practical-btn{font-size:26px;font-weight:900;color:#fff;padding:0;text-shadow:0 1px 2px #16336bcc}
/* ≈ drawn as an SVG so it is centred exactly on the button face on every device/font */
.practical-btn{display:flex;align-items:center;justify-content:center}
.practical-btn .approx-icon{width:15px;height:12.7px;display:block;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;filter:drop-shadow(0 1px 1px #16336bcc)}
/* M, m, b, # symbols sized to match the circle-button symbols */
.swipe-btn.up .btn-label,.swipe-btn.down .btn-label,.swipe-btn.left .btn-label,.swipe-btn.right .btn-label{font-size:22px;font-weight:900}
/* aug (+), dim (°), s2 and s4 face symbols, sized to match the M, m, b, # symbols */
.swipe-btn.aug .btn-label,.swipe-btn.dim .btn-label,.swipe-btn.sus2 .btn-label,.swipe-btn.sus4 .btn-label{font-size:22px;font-weight:900}
.swipe-btn.dim .btn-label{font-size:28px;transform:translateY(3px)}
/* Row colour groups: top (sus4, aug) violet, middle (#, M, b) original blue glass, bottom (m, dim, sus2) teal. */
.swipe-btn.sus4,.swipe-btn.aug{background:linear-gradient(145deg,rgba(190,140,255,.42) 0%,rgba(140,90,230,.16) 52%,rgba(110,60,200,.3) 100%)}
.swipe-btn.sus4:not(.active),.swipe-btn.aug:not(.active){border-color:rgba(215,185,255,.45);box-shadow:inset 2px 2px 4px #ffffff55,inset -3px -3px 5px #4a208d88,0 6px 10px #0008}
.swipe-btn.sus4:not(.active):active,.swipe-btn.aug:not(.active):active{box-shadow:inset 2px 2px 4px #ffffff44,inset -2px -2px 4px #4a208d88,0 3px 6px #0008}
.swipe-btn.down,.swipe-btn.dim,.swipe-btn.sus2{background:linear-gradient(145deg,rgba(90,215,185,.4) 0%,rgba(50,170,150,.16) 52%,rgba(30,140,125,.3) 100%)}
.swipe-btn.down:not(.active),.swipe-btn.dim:not(.active),.swipe-btn.sus2:not(.active){border-color:rgba(160,240,220,.45);box-shadow:inset 2px 2px 4px #ffffff55,inset -3px -3px 5px #0f5a5088,0 6px 10px #0008}
.swipe-btn.down:not(.active):active,.swipe-btn.dim:not(.active):active,.swipe-btn.sus2:not(.active):active{box-shadow:inset 2px 2px 4px #ffffff44,inset -2px -2px 4px #0f5a5088,0 3px 6px #0008}
/* No text selection, carets, callout menus or magnifier loupes anywhere */
html,body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;caret-color:transparent}

::selection{background:transparent}

::-moz-selection{background:transparent}
/* Two-ring circle of fifths: major keys outside, relative minors inside. */
.wheel-disc{position:relative;width:100%;height:100%;display:block;border-radius:50%;background:#111419;flex:none;overflow:visible}
#keyWheel{position:relative;width:100%;height:100%;display:block;overflow:visible}
.wheel-base{fill:#111419;stroke:#2a2c32;stroke-width:.25}
.wheel-sector{cursor:pointer;stroke:#0a0b0d;stroke-width:.26;stroke-linejoin:round}
.wheel-label{paint-order:stroke;stroke:rgba(0,0,0,.4);stroke-width:.5px;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.wheel-label.outer{font-size:9.2px}.wheel-label.inner{font-size:5.8px}
.wheel-center{fill:url(#wheelCenterGradient);stroke:#08090b;stroke-width:.5}
.wheel-center-ring{fill:none;stroke:#d6544a;stroke-width:.5;pointer-events:none}
.wheel-center-label{fill:#ca4f45;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
/* Vertical triad note bar: one block per chord, root label (underlined) with its three notes on one line below. Hold to move. */
.note-bar{--chord-accent:#6cc4ff;position:fixed;left:8px;bottom:8px;top:auto;width:max-content!important;height:auto!important;z-index:12;display:flex;flex-direction:column;padding:4px 7px;border:var(--line) solid rgba(67,139,255,.8);border-radius:9px;background:var(--bar-bg);box-shadow:0 10px 18px rgba(0,0,0,.95),0 3px 6px rgba(0,0,0,.9);touch-action:none;pointer-events:auto;cursor:grab;user-select:none;-webkit-user-select:none}
.note-bar.dragging{cursor:grabbing;box-shadow:0 16px 26px #000,0 4px 8px #000}
.note-motion{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));grid-template-rows:repeat(2,27px);margin:calc(-4px) -7px 4px;border-bottom:var(--line) solid var(--blue);border-radius:calc(9px - var(--line)) calc(9px - var(--line)) 0 0;pointer-events:none}
.note-motion .motion-cell{border-right:var(--line) solid var(--blue);border-bottom:var(--line) solid var(--blue);font-size:calc(var(--font)*.86);font-weight:500}
.note-motion .motion-cell.lc{border-right:0}
.note-motion .motion-cell.r2{border-bottom:0}
.note-motion .motion-triangle{font-size:15px}
.note-chord{display:flex;flex-direction:column;align-items:center;gap:2px;padding:1px 0 0;min-width:0}
.note-chord+.note-chord{border-top:var(--line) solid transparent} /* the old faint separator is replaced by the shared outline below */
/* Outline around each triad block (chord label + notes + degree boxes): 2x the normal line thickness.
   Drawn as an overlay so layout is unchanged; neighbouring triads share one 2x line, the first triad's top line sits on the header rule,
   and the last triad's bottom line follows the bar's own rounded edge. */
.note-chord{position:relative}
.note-chord::after{content:"";position:absolute;left:calc(-7px - var(--line));right:calc(-7px - var(--line));top:0;bottom:0;box-sizing:border-box;border:calc(2*var(--line)) solid var(--blue);pointer-events:none}
.note-motion+.note-chord::after{top:calc(-4px - var(--line))}
.note-chord+.note-chord::after{top:calc(-2*var(--line))}
.note-chord:last-child{margin-bottom:-4px}
.note-chord:last-child::after{bottom:calc(-1*var(--line));border-radius:0 0 9px 9px}
/* Header (R 3 5 + arrows) at the top of the bar: its top and side outside lines are 2x too, following the bar's rounded corners; its bottom line is the first triad's top line above. */
.note-motion{position:relative}
.note-motion::after{content:"";position:absolute;left:calc(-1*var(--line));right:calc(-1*var(--line));top:calc(-1*var(--line));bottom:0;box-sizing:border-box;border:calc(2*var(--line)) solid var(--blue);border-bottom:0;border-radius:9px 9px 0 0;pointer-events:none}
.note-root{display:inline-block;font-size:calc(var(--font) + 1px);font-weight:800;line-height:1;color:var(--chord-accent);white-space:nowrap}
.note-col{display:flex;flex-direction:column;align-items:center;gap:0;min-width:0;width:100%;box-sizing:border-box;border-right:var(--line) solid var(--blue);border-bottom:0}
.note-deg{box-sizing:border-box;display:flex;align-items:center;justify-content:center;width:100%;font-size:calc(var(--font)*.85);font-weight:600;line-height:1;color:var(--fg);opacity:.65;border-top:0;padding:2px 0 3px;height:27px;overflow:visible} /* fixed height: a flat/sharp glyph in the degree label (b7) must never make the row taller */
.note-deg.degree-rule{border-bottom:var(--line) solid var(--blue);height:27px} /* same 27px as the note rows (the rule is inside the height, not added to it) */
.note-list{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:0;width:calc(var(--n,3)*var(--bw,32.84px));min-width:0;align-self:center;margin:1px -7px 0;/* every box is exactly --bw wide in every state; the bar is as wide as its columns (a 4th column adds one box), the list spans the bar edge to edge */font-size:var(--font);font-weight:500;line-height:1;color:var(--fg);white-space:nowrap}
/* Each note column now carries its vertical divider through the degree label to the bottom blue rule. */
.note-n{box-sizing:border-box;width:100%;height:27px;display:flex;align-items:center;justify-content:center;border-top:var(--line) solid var(--blue);border-bottom:var(--line) dashed var(--blue);/* dashed rule between every note and its degree label */border-right:0}
.note-col:last-child{border-right:0}
.note-root{align-self:center;display:flex;flex-wrap:wrap;align-items:baseline;align-content:center;justify-content:center;white-space:nowrap;height:var(--root-h,auto)} /* chord-name box: one fixed height for every chord quality (set by lockNoteBarSize), so the bar never changes height and no slack opens under the last chord */
/* The three circle buttons (≈, reset, 4) are their own stack, separate from the triad buttons. Hold to move. */
.circle-stack{position:fixed;left:calc(50% + 120px);top:calc(50% + 123px);width:39px;z-index:36;display:flex;flex-direction:column;align-items:center;gap:14px;touch-action:none;pointer-events:auto;cursor:grab;user-select:none;-webkit-user-select:none}
.circle-stack.dragging{cursor:grabbing}
/* Dragged to the bottom edge of the screen: the circle buttons lay out in a row; dragged away, back to a column. */
.circle-stack.horiz{flex-direction:row}
.circle-stack .practical-btn,.circle-stack .reset-btn,.circle-stack .set-btn{position:relative;left:0;top:0;flex:none;grid-column:auto;grid-row:auto;justify-self:auto;align-self:auto}
/* Slightly 3D, still sharp pad buttons: small corner radius, subtle top-lit gradient, bevel highlight, solid bottom edge like a keycap. No blur, no gloss. */
.swipe-pad .swipe-btn{--face-top:#2a457b;--face:#223966;--edge:#0a0f1a;--line:#6b92dc;background:linear-gradient(180deg,var(--face-top) 0%,var(--face) 100%);border:1px solid var(--line);border-radius:5px;-webkit-backdrop-filter:none;backdrop-filter:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 -2px 0 rgba(0,0,0,.22),0 3px 0 var(--edge),0 6px 9px rgba(0,0,0,.95),0 9px 14px rgba(0,0,0,.7);transition:transform .06s,box-shadow .06s}
.swipe-pad .swipe-btn:active{transform:translateY(2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.2),0 1px 0 var(--edge),0 2px 4px rgba(0,0,0,.95)}
.swipe-pad .swipe-btn .btn-label{text-shadow:0 1px 0 rgba(0,0,0,.45)}
/* Row colour groups: top (s4, +) violet, middle (#, M, b) blue, bottom (m, °, s2) teal. */
.swipe-pad .swipe-btn.sus4,.swipe-pad .swipe-btn.aug{--face-top:#2a457b;--face:#223966;--edge:#0a0f1a;--line:#6b92dc} /* same blue as M */
.swipe-pad .swipe-btn.down,.swipe-pad .swipe-btn.dim,.swipe-pad .swipe-btn.sus2{--face-top:#1e6662;--face:#16524b;--edge:#0a0f1a;--line:#63cdb9}

<script>
// Nothing may be dragged (or pinch-resized) closer to the screen edge than the triad bar sits: 8px on every side.
const EDGE=8;

function accidentalValue(acc){
  if(!acc) return 0;
  return [...acc].reduce((sum,ch)=>sum+(ch==='♯'?1:ch==='♭'?-1:ch==='𝄪'?2:ch==='𝄫'?-2:0),0);
}
function accidentalText(value){
  // Standard notation: pairs of sharps/flats are written as double signs, with a single sign for any odd one out
  // (3 sharps = 𝄪♯, 3 flats = 𝄫♭, 4 sharps = 𝄪𝄪), never a row of separate ♯ or ♭ signs.
  if(!value)return '';
  const n=Math.abs(value),dbl=value>0?'𝄪':'𝄫',one=value>0?'♯':'♭';
  return dbl.repeat(Math.floor(n/2))+(n%2?one:'');
}
// Writes an accidental into an element; any double flat (𝄫) goes in its own span so it can be sized separately (see .dbl-flat).
function fillAccidental(el,text){

  [...text].forEach(ch=>{
    if(ch==='𝄫'){const s=document.createElement('span');s.className='dbl-flat';s.textContent=ch;el.append(s)}
    else el.append(ch);
  });

const naturalPitch={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
let rootAlter=0; // 0 natural, +1 sharp, -1 flat
let practicalSpelling=false;
let fullNotes=false; // false = 5-note voicings for 11 / 13; true = the full stacked chord (R 3 5 7 9 11 [13])

function normalizeAccidental(value){

  let v=((value%12)+12)%12;
  if(v>6)v-=12;
  return v;
}
function triadIntervals(){
  if(selectedMode==='diminished') return [0,3,6];
  if(selectedMode==='sus2') return [0,2,7];
  if(selectedMode==='sus4') return [0,5,7];
  if(selectedMode==='augmented') return isMinor?[0,3,8]:[0,4,8];
  return isMinor?[0,3,7]:[0,4,7];

function seventhSemis(){
  if(!seventh)return null;

  if(selectedMode==='diminished')return seventh==='b7'?10:9; // dim + 7 = half-diminished (m7b5); dim + maj7 = fully diminished (bb7)

function extOn(){return !!ext&&!!seventh&&seventh!=='6'}
// The chord's notes, one {semi, step, deg} per bar row/column. 9 / 11 / 13 use the usual 5-note guitar voicings:
//   9  = R 3 5 7 9      11 = R 5 7 9 11 (major / sus4: the 3rd is dropped) or R 3 5 7 11 (minor, dim, aug, sus2: the 9th is dropped)      13 = R 3 7 9 13 (5th and 11th dropped)
// A note that would repeat an earlier pitch (sus2 + 9, sus4 + 11) is left out.
function chordTones(){
  const ti=triadIntervals(),ls=triadLetterSteps(),dg=baseDegrees();
  const triad=ti.map((semi,i)=>({semi,step:ls[i],deg:dg[i]}));
  if(!seventh)return triad;

  if(!extOn())return [...triad,sev];

  else out=full?[...triad,sev,n9,n11,n13]:[triad[0],triad[1],sev,n9,n13];
  return out.filter((t,i)=>out.findIndex(u=>u.semi%12===t.semi%12)===i);

function chordIntervals(){return chordTones().map(t=>t.semi)}

function triadLetterSteps(){
  if(selectedMode==='sus2') return [0,1,4]; // 3rd is replaced by the 2nd
  if(selectedMode==='sus4') return [0,3,4]; // 3rd is replaced by the 4th

  // clearest enharmonic spelling for the root, major/minor third, and fifth.
  const rootPitch=(naturalPitch[notes[0]]+rootAlter+120)%12;

  // Registered after enableDrag, so a second finger cancels the hold-drag that the first finger started.
  wheelWrap.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse')return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){
      wheelDrag.cancel();
      window.__wheelPinch=true;window.__triadDragging=true; // also keeps the screen-wide swipe handler quiet
      startDist=Math.max(1,spread());startScale=wheelScale;
      pts.forEach((_,id)=>{try{wheelWrap.setPointerCapture(id)}catch(_){}});
    }
  });
  wheelWrap.addEventListener('pointermove',e=>{
    const p=pts.get(e.pointerId);if(!p)return;
    p.x=e.clientX;p.y=e.clientY;
    if(window.__wheelPinch&&pts.size>=2){e.preventDefault();setWheelSize(startScale*spread()/startDist)}
  });
  function release(e){
    if(!pts.delete(e.pointerId))return;
    if(pts.size===0&&window.__wheelPinch){
      window.__wheelPinch=false;window.__triadDragging=false;
      suppressClickUntil=Date.now()+350; // a pinch must never count as a tap on a key
    }
  }
  wheelWrap.addEventListener('pointerup',release);
  wheelWrap.addEventListener('pointercancel',release);
  wheelWrap.addEventListener('click',e=>{
    if(Date.now()<suppressClickUntil){e.preventDefault();e.stopPropagation()}
  },true);
  // Trackpad pinch on desktop (ctrl+wheel) and Safari's own gesture events.
  wheelWrap.addEventListener('wheel',e=>{
    if(!e.ctrlKey)return;
    e.preventDefault();setWheelSize(wheelScale*Math.exp(-e.deltaY*0.01));
  },{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(t=>wheelWrap.addEventListener(t,e=>e.preventDefault()));
})();
// Never allow text selection (which is what triggers iOS cursors, handles and the magnifier).
['selectstart','contextmenu','dragstart'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{capture:true,passive:false}));
document.addEventListener('selectionchange',()=>{const sel=window.getSelection&&window.getSelection();if(sel&&sel.rangeCount)sel.removeAllRanges()});
// ---- Default layout: no item may sit on top of another, at load, on refresh and on resize. ----
// Each item has an ideal spot (the arrangement from the screenshot: wheel under the bar, formula beside it, note bar
// under the wheel, buttons bottom right). If the ideal spot is free it is used; otherwise the nearest free spot is.
function packDefaultLayout(W,H,bar,items,fixed){
  const M=8,top=bar.y+bar.h+M,placed=[bar,...Object.values(fixed)],out={};
  const hit=(a,b,g)=>a.x<b.x+b.w+g&&b.x<a.x+a.w+g&&a.y<b.y+b.h+g&&b.y<a.y+a.h+g;
  const overlap=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
  const ref=id=>out[id]||fixed[id];
  items.forEach(it=>{
    const ideal=it.ideal(ref,{W,H,M,top});
    const xs=[ideal.x,M,W-M-it.w],ys=[ideal.y,top,H-M-it.h];
    placed.forEach(r=>{xs.push(r.x,r.x+r.w+M,r.x+r.w-it.w,r.x-M-it.w);ys.push(r.y,r.y+r.h+M,r.y+r.h-it.h,r.y-M-it.h)});
    let best=null;
    for(const gap of [M,2,0]){
      xs.forEach(x=>ys.forEach(y=>{
        if(x<M-.01||y<top-.01||x+it.w>W-M+.01||y+it.h>H-M+.01)return;
        const c={x,y,w:it.w,h:it.h};
        if(placed.some(r=>hit(c,r,gap)))return;
        const d=Math.hypot(x-ideal.x,y-ideal.y);
        if(!best||d<best.d)best={x,y,d};
      }));
      if(best)break;
    }
    if(!best){ // the screen is too small for everything: least overlap, kept on screen
      let least=Infinity;
      xs.forEach(x=>ys.forEach(y=>{
        const cx=Math.max(M,Math.min(W-M-it.w,x)),cy=Math.max(top,Math.min(H-M-it.h,y)),c={x:cx,y:cy,w:it.w,h:it.h};
        const score=placed.reduce((t,r)=>t+overlap(c,r),0)*1000+Math.hypot(cx-ideal.x,cy-ideal.y);
        if(score<least){least=score;best={x:cx,y:cy}}
      }));
    }
    out[it.id]={x:best.x,y:best.y,w:it.w,h:it.h};placed.push(out[it.id]);
  });
  return out;
}
// ---- Layout persistence: positions and wheel size are saved, so nothing is ever reset behind the user's back. ----
const LAYOUT_KEY='chordBoardLayout.v2';
const layoutEls=()=>({wheel:document.querySelector('.key-wheel-wrap'),note:document.getElementById('noteBar'),pad:document.querySelector('.swipe-pad'),stack:document.getElementById('circleStack'),quality:document.getElementById('qualityBox')});
function saveLayout(){
  try{
    const out={wheelScale},els=layoutEls();
    out.stackHoriz=!!(els.stack&&els.stack.classList.contains('horiz'));
    Object.entries(els).forEach(([id,el])=>{if(el&&el.dataset.moved){const r=el.getBoundingClientRect();out[id]={x:r.left,y:r.top-(lblShifted.get(el)||0),w:r.width,h:r.height}}});
    const bar=document.getElementById('bottomWrap');
    if(bar&&bar.dataset.moved)out.bar={y:bar.getBoundingClientRect().top-(lblShifted.get(bar)||0)};
    localStorage.setItem(LAYOUT_KEY,JSON.stringify(out));
  }catch(_){}
}
function restoreLayout(){
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem(LAYOUT_KEY))}catch(_){}
  if(!saved)return;
  const els=layoutEls(),bar=document.getElementById('bottomWrap');
  if(saved.bar&&bar&&isFinite(saved.bar.y)){bar.dataset.moved='1';bar.style.top=Math.max(EDGE,saved.bar.y)+'px'}
  if(isFinite(saved.wheelScale))wheelScale=Math.max(1,Math.min(1.3,saved.wheelScale));
  Object.entries(els).forEach(([id,el])=>{
    const p=saved[id];if(!el||!p||!isFinite(p.x)||!isFinite(p.y))return;
    el.dataset.moved='1';
    const st={position:'fixed',left:p.x+'px',top:p.y+'px',right:'auto',bottom:'auto',transform:'none'};
    if(id==='wheel'){const size=172.5*wheelScale;st.width=size+'px';st.height=size+'px'}
    Object.assign(el.style,st);
    if(id==='stack'&&saved.stackHoriz&&typeof setCircleOrientation==='function')setCircleOrientation(el,true);
  });
}
// Keep every item on screen when the window changes size (no re-packing, nothing is moved otherwise).
function clampLayout(){
  Object.values(layoutEls()).forEach(el=>{
    if(!el||el.style.position!=='fixed')return;
    const r=el.getBoundingClientRect();
    const vi=visibleInsets(el);
    const x=Math.max(EDGE-vi.left,Math.min(innerWidth-EDGE-r.width+vi.right,r.left)),y=Math.max(EDGE-vi.top,Math.min(innerHeight-EDGE-r.height+vi.bottom,r.top));
    if(Math.abs(x-r.left)>.5)el.style.left=x+'px';
    if(Math.abs(y-r.top)>.5)el.style.top=y+'px';
  });
}
// ---- Default layout (the arrangement from the reference screenshot): note bar left, wheel centre, formula box right
// of the wheel, triad pad below, circle buttons bottom right. Used only for items the user has never moved. ----
function referenceLayout(W,H,bar,sz){
  const bb=bar.y+bar.h,M=8,P={};
  P.wheel={x:W-M-sz.wheel.w,y:bb+20.5};
  P.note={x:M,y:bb+22};
  P.stack={x:W-M-sz.stack.w-9,y:bb+537.5};
  P.pad={x:P.stack.x-sz.stack.w-sz.pad.w-2.5,y:bb+446};
  Object.keys(P).forEach(id=>{
    P[id].x=Math.max(M,Math.min(W-M-sz[id].w,P[id].x));
    P[id].y=Math.max(M,Math.min(H-M-sz[id].h,P[id].y));
    P[id].w=sz[id].w;P[id].h=sz[id].h;
  });
  return P;
}
function applyDefaultLayout(){
  const G=14,q=id=>document.getElementById(id);
  const els=layoutEls();
  if(Object.values(els).some(e=>!e))return;
  const rect=el=>{const r=el.getBoundingClientRect();return{x:r.left,y:r.top,w:r.width,h:r.height}};
  const size=el=>({w:el.offsetWidth,h:el.offsetHeight});
  const bar=rect(q('bottomWrap'));
  bar.h+=(7-(parseInt(document.documentElement.dataset.n)||3))*(parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--cell'))||0); // keep room for the tallest bar (5 rows) so nothing below ever sits under it
  const free=[],fixed={};
  ['wheel','note','pad','stack'].forEach(id=>{els[id].dataset.moved?fixed[id]=rect(els[id]):free.push(id)});
  if(!free.length)return;
  // 1) The reference arrangement, when it fits without any item touching another.
  const sz={};free.forEach(id=>sz[id]=size(els[id]));
  ['wheel','note','pad','stack'].forEach(id=>{if(!sz[id])sz[id]={w:fixed[id].w,h:fixed[id].h}});
  const ref=referenceLayout(innerWidth,innerHeight,bar,sz);
  const placed=[bar,...Object.values(fixed)],out={};
  const hit=(a,b)=>a.x<b.x+b.w&&b.x<a.x+a.w&&a.y<b.y+b.h&&b.y<a.y+a.h;
  let ok=true;
  free.forEach(id=>{if(placed.some(r=>hit(ref[id],r)))ok=false;placed.push(ref[id]);out[id]=ref[id]});
  // 2) Otherwise (very small screens) fall back to the nearest-free-spot packer.
  if(!ok){
    const ideals={
      wheel:(r,c)=>({x:c.M,y:c.top}),
      note:(r,c)=>{const w=r('wheel');return{x:c.M,y:w.y+w.h+c.M}},
      pad:(r,c)=>({x:c.W-c.M-els.stack.offsetWidth-G-els.pad.offsetWidth,y:c.H-c.M-els.pad.offsetHeight}),
      stack:(r,c)=>{const p=r('pad');return{x:p.x+p.w+G,y:p.y+3}}
    };
    const items=free.map(id=>({id,...size(els[id]),ideal:ideals[id]}));
    const packed=packDefaultLayout(innerWidth,innerHeight,bar,items,fixed);
    Object.keys(out).forEach(k=>delete out[k]);Object.assign(out,packed);
  }
  // The pad is wider now (5 columns): put the note bar one gap to its right and push the circle buttons out to the right edge, when the screen is wide enough for all three side by side.
  if(out.note&&out.pad){
    const pr=out.pad,nr=out.note,sr=out.stack||fixed.stack,W=innerWidth,M=8;
    const nx=pr.x+pr.w+G,sx=W-M-(sr?sr.w:0);
    if(nr.y<pr.y+pr.h&&pr.y<nr.y+nr.h&&nx+nr.w+G<=sx){nr.x=nx;if(out.stack)out.stack.x=sx}
  }
  Object.entries(out).forEach(([id,r])=>{
    Object.assign(els[id].style,{position:'fixed',left:r.x+'px',top:r.y+'px',right:'auto',bottom:'auto',transform:'none'});
  });
}
try{restoreLayout()}catch(_){}
if(wheelScale!==1.3){const w=document.querySelector('.key-wheel-wrap');if(w&&!w.dataset.moved){const size=172.5*wheelScale;w.style.width=size+'px';w.style.height=size+'px'}}
function placeQualityBox(){
  const box=document.getElementById('qualityBox'),f=document.querySelector('.key-wheel-wrap');
  if(!box||!f||box.dataset.moved)return;
  updateQualityBox();
  const r=f.getBoundingClientRect();
  box.style.left=Math.max(EDGE,Math.min(innerWidth-EDGE-box.offsetWidth,r.right-box.offsetWidth))+'px';
  box.style.top=Math.min(innerHeight-EDGE-box.offsetHeight,r.bottom+10)+'px';
}
try{applyDefaultLayout()}catch(_){}
try{placeQualityBox()}catch(_){}
// Default placement runs at load only. A resize or rotation never re-arranges anything: it just keeps items on screen.
window.addEventListener('load',()=>{try{lockNoteBarSize();alignLabels();applyDefaultLayout();placeQualityBox();updateQualityBox();clampLayout();keepLabelsOnScreen()}catch(_){}});
window.addEventListener('resize',()=>requestAnimationFrame(clampLayout));
window.addEventListener('orientationchange',()=>setTimeout(clampLayout,250));
// Save after every move or pinch (capture phase, so it runs even when the control stops propagation).
['pointerup','pointercancel'].forEach(t=>window.addEventListener(t,()=>setTimeout(saveLayout,60),true));
</script></body></html>
