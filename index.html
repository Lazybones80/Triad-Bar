<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101319"><title>Triad Bar</title>
<style>
:root{color-scheme:dark;--bg:#101319;--panel:#0d111a;--blue:#438bff;--fg:#f5f8ff;--cell:34px;--font:15px;--line:.5px;--pad:8px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}main{width:100%;height:100%;background:var(--bg)}
.key-wheel-wrap{display:none!important;position:fixed;z-index:30;left:50%;top:calc(50% - 86.25px);bottom:auto;transform:translateX(-50%);width:172.5px;display:flex;flex-direction:column;align-items:stretch;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}.key-wheel-wrap.dragging{cursor:grabbing}.wheel-disc{width:172.5px;height:172.5px;display:grid;place-items:center;border-radius:50%;background:rgba(16,19,25,.96);border:.5px solid var(--blue);box-shadow:0 2px 8px #0008;flex:none}#keyWheel{width:100%;height:100%;display:block;overflow:visible}.wheel-sector{cursor:pointer;stroke:var(--blue);stroke-width:.2}.wheel-sector.active{stroke:var(--blue);stroke-width:.625}.wheel-label{fill:#f3f5fa;font-size:8px;font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.wheel-center{fill:#161b24;stroke:var(--blue);stroke-width:.325}.wheel-center-label{fill:#ff6862;font-size:10px;font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.mode-indicator{display:none!important}
.bars-area{position:fixed;inset:0;z-index:10;pointer-events:none}.bar-wrap{position:fixed;width:calc(100% - 16px);left:8px;right:auto;touch-action:none;pointer-events:auto;user-select:none;-webkit-user-select:none}#topWrap{top:72%}#bottomWrap{top:9%}.chord-labels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));width:100%;height:30px;align-items:center;margin-bottom:2px;color:#f5f8ff;font-size:var(--font);font-weight:500;text-align:center;line-height:1}.chord-label{display:block;min-width:0;width:100%;height:100%;position:relative;overflow:visible;white-space:nowrap}.label-root-acc{position:absolute;left:25%;top:50%;margin-left:-.5em;transform:translateY(-50%);display:inline-flex;align-items:center;justify-content:flex-start;white-space:nowrap}.label-root{display:inline-block;flex:0 0 1em;width:1em;text-align:center;line-height:1}.label-acc{display:inline-block;line-height:1;margin-left:.06em}.label-acc:empty{margin-left:0}.label-suffix{display:inline-block;font-size:.9em;line-height:1;white-space:nowrap;margin-left:.08em}.triad-bar{display:grid;width:100%;background:var(--panel);border:.75px solid var(--blue);border-right:1px solid var(--blue);grid-template-columns:repeat(var(--groups),minmax(0,1fr));}
.triad-group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-width:0;border-right:.75px solid var(--blue)}.triad-group:last-child{border-right:0}.note-stack,.acc-stack{display:grid;grid-template-rows:repeat(3,var(--cell));min-width:0}.note-stack{border-right:.75px solid var(--blue)}.acc-stack{border-right:.5px solid var(--blue)}.triad-cell{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;white-space:nowrap;font-size:var(--font);line-height:1;font-weight:500;border-bottom:.5px solid var(--blue);color:var(--fg);padding:0 1px}.triad-cell:last-child{border-bottom:0}.acc-stack .triad-cell{font-size:var(--font)}.blank{color:transparent!important}.double-accidental{color:var(--blue)!important}
@media(max-width:390px){.motion-indicator .formula-cell{font-size:calc(var(--font)*.8)!important}.bars-area{gap:14px}.triad-cell{padding:0}.acc-stack .triad-cell{font-size:var(--font)}}
.swipe-pad{position:fixed;right:12px;top:calc(50% - 44.5px);transform:none;width:133px;height:89px;display:grid;grid-template-columns:repeat(3,39px);grid-template-rows:repeat(2,39px);column-gap:8px;row-gap:11px;z-index:26;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}
.swipe-btn{position:relative;justify-self:center;align-self:center;width:39px;height:39px;background:linear-gradient(145deg,#78a2ff 0%,#4d7ee8 52%,#3566c8 100%);border:1px solid #86aaff;border-radius:11px;padding:0;margin:0;outline:none;display:flex;align-items:center;justify-content:center;color:#fff;line-height:1;font-family:Arial,sans-serif;box-shadow:inset 2px 2px 4px #ffffff55,inset -3px -3px 5px #183d8d88,0 6px 10px #0008;transition:transform .08s,box-shadow .08s}
.swipe-btn:active{transform:translateY(3px);box-shadow:inset 2px 2px 4px #ffffff44,inset -2px -2px 4px #183d8d88,0 3px 6px #0008}
.swipe-btn.active{border-color:#e0b342;box-shadow:inset 2px 2px 4px #ffffff33,inset -3px -3px 5px #183d8d88,0 0 0 1px #e0b342,0 7px 14px #0009}
.motion-indicator{position:absolute;left:calc(50% - (var(--cell) + 40.5px)/2);top:calc(-3 * var(--cell) - 11px);width:calc(var(--cell) + 40.5px);height:calc(3 * var(--cell));display:grid;grid-template-columns:var(--cell) 40.5px;grid-template-rows:repeat(3,var(--cell));background:var(--panel);border:.75px solid var(--blue);border-radius:0;overflow:hidden;box-shadow:none;pointer-events:none}.motion-cell{display:flex;align-items:center;justify-content:center;border-right:.5px solid var(--blue);border-bottom:.5px solid var(--blue);color:#fff;font-size:22px;font-weight:800;line-height:1;text-shadow:none;min-width:0;min-height:0}.motion-triangle-pair{display:inline-flex;align-items:center;justify-content:center;gap:0;max-width:100%;white-space:nowrap}.motion-triangle{display:inline-block;font-size:17px;line-height:1;font-weight:900;transform:scaleX(.95);flex:0 0 auto;color:#fff}.motion-cell.double-motion,.formula-cell.double-motion,.double-motion .motion-triangle{color:var(--blue)!important}.motion-arrow-cell{grid-column:2;border-right:0}.formula-cell{grid-column:1;font-family:inherit;font-size:calc(var(--font)*.86)!important;font-weight:500!important;line-height:1;border-right:.5px solid var(--blue)}.motion-cell[style*="grid-row:3"]{border-bottom:0}.motion-middle{font-size:21px}.swipe-btn .btn-label{position:relative;z-index:1;display:block;text-align:center;color:#fff;font-size:15px;font-weight:800;line-height:1;letter-spacing:0;white-space:nowrap;pointer-events:none;text-shadow:0 2px 2px #16336bcc}
.swipe-btn.up{left:auto;right:auto;top:auto;bottom:auto;grid-column:2;grid-row:1}
.swipe-btn.down{left:auto;right:auto;top:auto;bottom:auto;grid-column:2;grid-row:2}
.swipe-btn.left{left:auto;right:auto;top:auto;bottom:auto;grid-column:1;grid-row:1}
.swipe-btn.right{left:auto;right:auto;top:auto;bottom:auto;grid-column:3;grid-row:1}
.reset-btn{position:relative;left:auto;top:auto;justify-self:center;align-self:center;grid-column:1;grid-row:2;width:33px;height:33px;border-radius:10px;border:1px solid #91b2ff;background:linear-gradient(145deg,#405b88,#202d47);color:#dce7ff;font-size:10px;font-weight:800;line-height:1;box-shadow:inset 2px 2px 4px #ffffff22,inset -3px -3px 5px #0008,0 3px 0 #080d17,0 5px 9px #0008;cursor:pointer}
.practical-btn{z-index:50;pointer-events:auto;touch-action:manipulation;position:relative;left:auto;top:auto;justify-self:center;align-self:center;grid-column:3;grid-row:2;width:33px;height:33px;border-radius:10px;border:1px solid #91b2ff;background:linear-gradient(145deg,#405b88,#202d47);color:#dce7ff;font-size:10px;font-weight:800;line-height:1;box-shadow:inset 2px 2px 4px #ffffff22,inset -3px -3px 5px #0008,0 3px 0 #080d17,0 5px 9px #0008;cursor:pointer}.practical-btn.active{border-color:#e0b342;box-shadow:inset 2px 2px 4px #ffffff44,inset -3px -3px 5px #0008,0 0 0 1px #e0b342}.practical-btn:active{transform:translateY(2px)}
.reset-btn:active{transform:translateY(2px);box-shadow:inset 2px 2px 4px #ffffff18,inset -2px -2px 4px #0008,0 1px 0 #080d17,0 3px 6px #0008}
/* Restored detailed CoF and chart drag handle. Keep the wheel at its original 172.5px canvas size. */
.key-wheel-wrap{display:flex!important;width:172.5px;height:172.5px;position:fixed;z-index:30;left:50%;top:calc(50% - 86.25px);bottom:auto;transform:translateX(-50%);align-items:stretch;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;filter:drop-shadow(0 9px 15px #000b)}
.key-wheel-wrap.dragging,.swipe-pad.dragging{cursor:grabbing}
.wheel-disc{position:relative;width:172.5px;height:172.5px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle at 35% 22%,#536f9f 0%,#263a5d 32%,#121d31 70%,#070b13 100%);border:1px solid #a9c7ff;box-shadow:inset 0 1px 0 #ffffff80,inset 0 -12px 18px #03060dcc,0 0 0 2px #1b3a6dcc,0 8px 18px #000b;flex:none;overflow:visible}
.wheel-disc::before{content:"";position:absolute;inset:5px;border-radius:50%;border:1px solid #d9e7ff55;box-shadow:inset 0 0 0 1px #050a1555,0 0 12px #77a7ff44;pointer-events:none;z-index:2}
.wheel-disc::after{content:"";position:absolute;left:18%;right:18%;top:7%;height:22%;border-radius:50%;background:linear-gradient(180deg,#ffffff55,#ffffff00);filter:blur(5px);opacity:.75;pointer-events:none;z-index:2}
#keyWheel{position:relative;z-index:3;width:100%;height:100%;display:block;overflow:visible;filter:drop-shadow(0 2px 2px #000b)}
.wheel-sector{cursor:pointer;stroke:#d8e6ff;stroke-width:.28;paint-order:stroke;filter:url(#wheelSectorShadow);transition:stroke-width .12s,filter .12s}
.wheel-sector:hover{stroke:#ffffff;stroke-width:.6;filter:url(#wheelGlow)}
.wheel-sector.active{stroke:#ffe58c;stroke-width:.8;filter:url(#wheelGlow)}
.wheel-label{fill:#f8fbff;font-size:8.2px;font-weight:800;letter-spacing:.2px;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:#09111f;stroke-width:.7px;pointer-events:none}
.wheel-rim{fill:none;stroke:#d5e4ff;stroke-width:.72;opacity:.9;pointer-events:none}
.wheel-inner-rim{fill:none;stroke:#8fb5ff;stroke-width:.55;opacity:.8;pointer-events:none}
.wheel-tick{stroke:#e9f1ff;stroke-width:.42;opacity:.72;pointer-events:none}
.wheel-center{fill:url(#wheelCenterGradient);stroke:#d9e7ff;stroke-width:.72;filter:url(#wheelShadow)}
.wheel-center-ring{fill:none;stroke:#ffe58c;stroke-width:.48;opacity:.9;pointer-events:none}
.wheel-center-label{fill:#fff0a6;font-size:10.5px;font-weight:900;text-anchor:middle;dominant-baseline:middle;paint-order:stroke;stroke:#0a111d;stroke-width:.65px;pointer-events:none}
.wheel-center-caption{fill:#d8e6ff;font-size:3.7px;font-weight:800;letter-spacing:.7px;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.motion-indicator{pointer-events:auto;cursor:grab}
.swipe-pad{cursor:grab}/* Restrained CoF finish: one steel-blue palette, fewer decorative lines. */
.wheel-disc::before{border:0;box-shadow:inset 0 0 14px #050a1566,0 0 10px #77a7ff33}
.wheel-sector{stroke:#203754;stroke-width:.16;stroke-opacity:.8;filter:none}
.wheel-sector:hover{stroke:#dbe8ff;stroke-width:.45;filter:none}
.wheel-sector.active{stroke:#ffe58c;stroke-width:.62;filter:none}
.wheel-label{stroke:#09111f;stroke-width:.35px;letter-spacing:0}
.wheel-rim{stroke:#a9c3e9;stroke-width:.58;opacity:.82}
.wheel-inner-rim,.wheel-tick,.wheel-center-ring{display:none}</style></head>
<body><main>
<div class="key-wheel-wrap" aria-label="Circle of fifths key selector"><div class="wheel-disc"><svg id="keyWheel" viewBox="0 0 100 100" role="img" aria-label="Choose a key"></svg></div><div id="modeIndicator" class="mode-indicator" aria-hidden="true"></div></div>
<div class="bars-area" id="barsArea"><div class="bar-wrap" id="topWrap"><div class="chord-labels" id="topLabels" aria-label="Top chord labels"></div><div class="triad-bar" id="topBar" aria-label="Top triad row"></div></div><div class="bar-wrap" id="bottomWrap"><div class="chord-labels" id="bottomLabels" aria-label="Bottom chord labels"></div><div class="triad-bar" id="bottomBar" aria-label="Bottom triad row"></div></div></div>
<div class="swipe-pad" aria-label="Swipe controls"><div class="motion-indicator" id="motionIndicator" aria-hidden="true">
  <div class="motion-cell motion-arrow-cell" id="motionRoot" style="grid-column:2;grid-row:1"></div>
  <div class="motion-cell motion-middle motion-arrow-cell" id="motionThird" style="grid-column:2;grid-row:2"></div>
  <div class="motion-cell motion-arrow-cell" id="motionFifth" style="grid-column:2;grid-row:3"></div>
  <div class="motion-cell formula-cell" id="motionRootLabel" style="grid-column:1;grid-row:1">R</div>
  <div class="motion-cell formula-cell" id="motionThirdLabel" style="grid-column:1;grid-row:2">3</div>
  <div class="motion-cell formula-cell" id="motionFifthLabel" style="grid-column:1;grid-row:3">5</div>
</div><button class="swipe-btn up" id="btnUp" aria-label="Major"><span class="btn-label">M</span></button><button class="swipe-btn right" id="btnRight" aria-label="Sharp"><span class="btn-label">#</span></button><button class="swipe-btn down" id="btnDown" aria-label="Minor"><span class="btn-label">m</span></button><button class="swipe-btn left" id="btnLeft" aria-label="Flat"><span class="btn-label">b</span></button><button class="reset-btn" id="btnReset" aria-label="Reset">↻</button><button class="practical-btn" id="btnPractical" aria-label="Practical chord spelling">♭<br><small>OK</small></button></div></main>
<script>
const fifths=['C','G','D','A','E','B','F♯','D♭','A♭','E♭','B♭','F'];let selectedKey='C',selectedMode='major';
const groupsTop=[['F','A','C'],['C','E','G'],['G','B','D'],['D','F','A'],['A','C','E'],['E','G','B'],['B','D','F']];const groupsBottom=[['G','B','D'],['C','E','G'],['F','A','C'],['B','D','F'],['E','G','B'],['A','C','E'],['D','F','A']];

function accidentalValue(acc){
  if(!acc) return 0;
  return [...acc].reduce((sum,ch)=>sum+(ch==='♯'?1:ch==='♭'?-1:ch==='𝄪'?2:ch==='𝄫'?-2:0),0);
}
function accidentalText(value){
  return value===2?'𝄪':value===1?'♯':value===-1?'♭':value===-2?'𝄫':value>2?'♯'.repeat(value):value< -2?'♭'.repeat(-value):'';
}
const naturalPitch={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
let rootAlter=0; // 0 natural, +1 sharp, -1 flat
let practicalSpelling=false;
function normalizeAccidental(value){
  // Return the smallest signed semitone alteration (-6 to +6).
  // Do not wrap values such as +3 back into an invalid +3/-9 oscillation.
  let v=((value%12)+12)%12;
  if(v>6)v-=12;
  return v;
}
function triadIntervals(){
  if(selectedMode==='minor') return [0,3,7];
  if(selectedMode==='diminished') return [0,3,6];
  if(selectedMode==='augmented') return [0,4,8];
  return [0,4,7];
}
function practicalTriad(notes){
  // Preserve the actual root pitch and chord quality, but choose the
  // clearest enharmonic spelling for the root, major/minor third, and fifth.
  const rootPitch=(naturalPitch[notes[0]]+rootAlter+120)%12;
  const intervals=triadIntervals();
  const letters=['C','D','E','F','G','A','B'];
  const chordLetterSteps=[0,2,4]; // root, third, fifth (not root, second, third)
  const candidates=[];

  for(const letter of letters){
    const li=letters.indexOf(letter);
    const rootAcc=normalizeAccidental(rootPitch-naturalPitch[letter]);

    const tones=chordLetterSteps.map((step,i)=>{
      const toneLetter=letters[(li+step)%7];
      const targetPitch=(rootPitch+intervals[i])%12;
      const acc=normalizeAccidental(targetPitch-naturalPitch[toneLetter]);
      return {letter:toneLetter,acc};
    });

    const allAccidentals=[rootAcc,...tones.map(t=>t.acc)];
    const cost=allAccidentals.reduce((sum,acc)=>sum+Math.abs(acc),0);

    // If two spellings are equally simple, retain the original root letter.
    // This keeps F# as F# rather than arbitrarily changing it to Gb.
    const originalLetterPenalty=letter===notes[0]?0:1;

    // As a final tie-break, follow the user's selected sharp/flat direction.
    const directionPenalty=
      rootAlter>0&&rootAcc<0 ? 1 :
      rootAlter<0&&rootAcc>0 ? 1 : 0;

    candidates.push({
      letter,
      rootAcc,
      tones,
      cost,
      originalLetterPenalty,
      directionPenalty
    });
  }

  candidates.sort((a,b)=>
    a.cost-b.cost ||
    a.originalLetterPenalty-b.originalLetterPenalty ||
    a.directionPenalty-b.directionPenalty ||
    a.letter.localeCompare(b.letter)
  );

  return candidates[0];
}
function chordSpelling(notes){
  const rootPitch=(naturalPitch[notes[0]]+rootAlter+120)%12;
  const intervals=triadIntervals();
  const theoretical={letter:notes[0],rootAcc:rootAlter,tones:notes.map((letter,i)=>({letter,acc:normalizeAccidental(rootPitch+intervals[i]-naturalPitch[letter])}))};
  if(!practicalSpelling) return theoretical;
  return practicalTriad(notes);
}
function chordAccidentals(notes){ return chordSpelling(notes).tones.map(t=>accidentalText(t.acc)); }
function chordSuffix(){return selectedMode==='minor'?'m':'';}
const wheel=document.getElementById('keyWheel'),indicator=document.getElementById('modeIndicator');function polar(r,a){return{x:50+r*Math.sin(a),y:50-r*Math.cos(a)}}function path(r1,r2,a1,a2){const p1=polar(r2,a1),p2=polar(r2,a2),p3=polar(r1,a2),p4=polar(r1,a1);return`M ${p1.x} ${p1.y} A ${r2} ${r2} 0 0 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${r1} ${r1} 0 0 0 ${p4.x} ${p4.y} Z`}
function drawWheel(){
  const ns='http://www.w3.org/2000/svg';
  const create=(tag,attrs={})=>{
    const el=document.createElementNS(ns,tag);
    Object.entries(attrs).forEach(([key,value])=>el.setAttribute(key,value));
    return el;
  };
  wheel.innerHTML='';
  const defs=create('defs');
  const discGradient=create('radialGradient',{id:'wheelDiscGradient',cx:'.34',cy:'.2',r:'.82'});
  discGradient.appendChild(create('stop',{offset:'0%','stop-color':'#5d78a7','stop-opacity':'1'}));
  discGradient.appendChild(create('stop',{offset:'42%','stop-color':'#263d64','stop-opacity':'1'}));
  discGradient.appendChild(create('stop',{offset:'78%','stop-color':'#111c30','stop-opacity':'1'}));
  discGradient.appendChild(create('stop',{offset:'100%','stop-color':'#060a12','stop-opacity':'1'}));
  defs.appendChild(discGradient);
  const centerGradient=create('radialGradient',{id:'wheelCenterGradient',cx:'.34',cy:'.25',r:'.9'});
  centerGradient.appendChild(create('stop',{offset:'0%','stop-color':'#405d8d'}));
  centerGradient.appendChild(create('stop',{offset:'65%','stop-color':'#14223b'}));
  centerGradient.appendChild(create('stop',{offset:'100%','stop-color':'#070d18'}));
  defs.appendChild(centerGradient);
  const shadow=create('filter',{id:'wheelShadow',x:'-40%',y:'-40%',width:'180%',height:'190%'});
  shadow.appendChild(create('feDropShadow',{dx:'0',dy:'1.2',stdDeviation:'1.1','flood-color':'#000','flood-opacity':'.8'}));
  defs.appendChild(shadow);
  const sectorGradient=create('linearGradient',{id:'wheelSectorGradient',x1:'0',y1:'0',x2:'1',y2:'1'});
  sectorGradient.appendChild(create('stop',{offset:'0%', 'stop-color':'#4a6b99', 'stop-opacity':'1'}));
  sectorGradient.appendChild(create('stop',{offset:'58%', 'stop-color':'#3b5981', 'stop-opacity':'.94'}));
  sectorGradient.appendChild(create('stop',{offset:'100%', 'stop-color':'#16263e', 'stop-opacity':'.94'}));
  defs.appendChild(sectorGradient);  wheel.appendChild(defs);
  wheel.appendChild(create('circle',{cx:'50',cy:'50',r:'48',class:'wheel-disc-base',fill:'url(#wheelDiscGradient)'}));
  const step=Math.PI*2/12;
  fifths.forEach((key,i)=>{
    const p=create('path',{d:path(18,47,i*step-step/2,i*step+step/2),fill:'url(#wheelSectorGradient)',class:'wheel-sector'+(key===selectedKey?' active':'')});
    p.addEventListener('click',()=>{selectedKey=key;render()});
    wheel.appendChild(p);
  });
  fifths.forEach((key,i)=>{
    const angle=i*step;

    const q=polar(38,angle);
    const label=create('text',{x:q.x,y:q.y,class:'wheel-label'});
    label.textContent=key;
    wheel.appendChild(label);
  });
  wheel.appendChild(create('circle',{cx:'50',cy:'50',r:'47.4',class:'wheel-rim'}));
  wheel.appendChild(create('circle',{cx:'50',cy:'50',r:'16',class:'wheel-center'}));
  const centerLabel=create('text',{x:'50',y:'48',class:'wheel-center-label'});
  centerLabel.textContent=selectedKey;
  wheel.appendChild(centerLabel);
  const centerCaption=create('text',{x:'50',y:'57.5',class:'wheel-center-caption'});
  centerCaption.textContent='CoF';
  wheel.appendChild(centerCaption);
}
function makeBar(el,groups){el.style.setProperty('--groups',groups.length);el.innerHTML='';groups.forEach(notes=>{const group=document.createElement('div');group.className='triad-group';const ns=document.createElement('div');ns.className='note-stack';const as=document.createElement('div');as.className='acc-stack';notes.forEach(letter=>{const n=document.createElement('div');n.className='triad-cell';n.textContent=letter;ns.appendChild(n);const a=document.createElement('div');a.className='triad-cell accidental';as.appendChild(a)});group.append(ns,as);el.appendChild(group)})}

function renderChordLabels(el,groups){
  el.innerHTML='';
  groups.forEach(notes=>{
    const label=document.createElement('div');
    label.className='chord-label';

    const rootAcc=document.createElement('span');
    rootAcc.className='label-root-acc';

    const root=document.createElement('span');
    root.className='label-root';

    const spelling=chordSpelling(notes);
    root.textContent=spelling.letter;

    const acc=document.createElement('span');
    acc.className='label-acc';
    acc.textContent=accidentalText(spelling.rootAcc);

    const suffix=document.createElement('span');
    suffix.className='label-suffix';
    suffix.textContent=chordSuffix();

    rootAcc.append(root,acc,suffix);
    label.appendChild(rootAcc);
    el.appendChild(label);
  });
}
function applyChordAccidentals(el,groups){
  [...el.querySelectorAll('.triad-group')].forEach((group,i)=>{
    const spelling=chordSpelling(groups[i]);
    const noteCells=group.querySelectorAll('.note-stack .triad-cell');
    const accidentalCells=group.querySelectorAll('.acc-stack .triad-cell');
    spelling.tones.forEach((tone,j)=>{
      const accidental=accidentalText(tone.acc)||'';
      const isDouble=accidental==='𝄪'||accidental==='𝄫';
      noteCells[j].textContent=tone.letter;
      accidentalCells[j].textContent=accidental;
      noteCells[j].classList.toggle('double-accidental',isDouble);
      accidentalCells[j].classList.toggle('double-accidental',isDouble);
    });
  });
}
function render(){
  indicator.textContent=`${selectedKey} ${selectedMode}`;
  drawWheel();
  applyChordAccidentals(document.getElementById('topBar'),groupsTop);
  applyChordAccidentals(document.getElementById('bottomBar'),groupsBottom);
  renderChordLabels(document.getElementById('topLabels'),groupsTop);
  renderChordLabels(document.getElementById('bottomLabels'),groupsBottom);
  // Directional selection: top=major (default), bottom=minor,
  // right=sharp, left=flat. Major is the default and is never outlined.
  document.getElementById('btnUp').classList.add('active');
  document.getElementById('btnDown').classList.toggle('active',selectedMode==='minor');
  document.getElementById('btnRight').classList.toggle('active',rootAlter===1);
  document.getElementById('btnLeft').classList.toggle('active',rootAlter===-1);
  document.getElementById('btnPractical').classList.toggle('active',practicalSpelling);
}
makeBar(document.getElementById('topBar'),groupsTop);makeBar(document.getElementById('bottomBar'),groupsBottom);render();showMotionFromTriadChange();
function fit(){const w=window.innerWidth;const cell=(w-18)/14;document.documentElement.style.setProperty('--cell',`${cell}px`);document.documentElement.style.setProperty('--font',`${Math.max(12,Math.min(28,cell*.68))}px`)}fit();window.addEventListener('resize',fit);
function showMotionFromTriadChange(){
  // Show the strongest accidental actually present in the rendered chord rows.
  // A sharped scale can require double-sharps on the 3rd and 5th, even though
  // the root control itself moved by only one semitone.
  const selectedFormula=[
    rootAlter,
    rootAlter+(selectedMode==='minor'?-1:0),
    rootAlter
  ];
  if(rootAlter!==0){
    const maxAccidentals=[0,0,0];
    [...groupsTop,...groupsBottom].forEach(notes=>{
      chordSpelling(notes).tones.forEach((tone,index)=>{
        maxAccidentals[index]=Math.max(maxAccidentals[index],Math.abs(tone.acc));
      });
    });
    maxAccidentals.forEach((count,index)=>{
      const direction=Math.sign(selectedFormula[index]||rootAlter);
      selectedFormula[index]=direction*count;
    });
  }
  const ids=['motionRoot','motionThird','motionFifth'];
  const labelIds=['motionRootLabel','motionThirdLabel','motionFifthLabel'];

  ids.forEach((id,index)=>{
    const cell=document.getElementById(id);
    const label=document.getElementById(labelIds[index]);
    if(!cell)return;
    const movement=selectedFormula[index];
    const count=Math.min(2,Math.abs(movement));
    const glyph=movement>0?'▲':'▼';
    cell.replaceChildren();
    cell.classList.toggle('double-motion',count===2);
    if(label)label.classList.toggle('double-motion',count===2);
    if(count===0)return;
    const pair=document.createElement('span');
    pair.className='motion-triangle-pair';
    for(let n=0;n<count;n++){
      const triangle=document.createElement('span');
      triangle.className='motion-triangle';
      triangle.textContent=glyph;
      pair.appendChild(triangle);
    }
    cell.appendChild(pair);
  });
}
function applyMajorButtonClick(){
  // A direct tap on M is the full default reset: natural-root major.
  // This is intentionally different from swiping up, which only changes
  // chord quality and preserves an active flat or sharp.
  selectedMode='major';
  rootAlter=0;
  showMotionFromTriadChange();
  render();
}
function applyDirection(dir){
  const previousMode=selectedMode,previousAlter=rootAlter;
  if(dir==='up'){
    // M changes chord quality only. Preserve the current flat/natural/sharp triad type.
    selectedMode='major';
  }else if(dir==='down'){
    // Clicking the active minor button returns to the default major mode.
    selectedMode = selectedMode === 'minor' ? 'major' : 'minor';
  }else if(dir==='right'){
    // Direct button press: sharp toggles back to natural when already active.
    rootAlter = rootAlter === 1 ? 0 : 1;
  }else if(dir==='left'){
    // Direct button press: flat toggles back to natural when already active.
    rootAlter = rootAlter === -1 ? 0 : -1;
  }
  showMotionFromTriadChange();
  render();
}

// Swipes move one position at a time across the horizontal controls:
// flat <-> natural/major <-> sharp. The indicator reflects the resulting
// strongest accidental in the rendered triad rows, not the physical swipe gesture.
function applySwipeDirection(dir){
  const previousMode=selectedMode,previousAlter=rootAlter;
  if(dir==='right'){
    rootAlter = Math.min(1, rootAlter + 1);
  }else if(dir==='left'){
    rootAlter = Math.max(-1, rootAlter - 1);
  }else{
    applyDirection(dir);
    return;
  }
  showMotionFromTriadChange();
  render();
}
function resetControls(){
  selectedKey='C';
  selectedMode='major';
  rootAlter=0;
  practicalSpelling=false;
  showMotionFromTriadChange();
  render();
}
// Screen-wide chord controls: left=minor, right=major, up=sharpen every chord root, down=flatten every chord root.
let swipe=null;
document.addEventListener('pointerdown',e=>{
  // Button taps are handled by their own click listeners, never as swipe gestures.
  if(e.target instanceof Element && (e.target.closest('button') || e.target.closest('.swipe-pad'))){
    swipe=null;
    return;
  }
  swipe={x:e.clientX,y:e.clientY,t:Date.now(),id:e.pointerId};
},{passive:true,capture:true});
document.addEventListener('pointerup',e=>{
  if(!swipe||swipe.id!==e.pointerId)return;
  const s=swipe;swipe=null;
  if(window.__triadDragging)return;
  const dx=e.clientX-s.x,dy=e.clientY-s.y;
  if(Date.now()-s.t>900||Math.max(Math.abs(dx),Math.abs(dy))<45)return;
  if(Math.abs(dy)>=Math.abs(dx)){
    applyDirection(dy<0?'up':'down');
  }else{
    applySwipeDirection(dx<0?'left':'right');
  }
},{passive:true,capture:true});
document.getElementById('btnReset').addEventListener('click',e=>{e.stopPropagation();showMotion('');resetControls()});
const practicalButton=document.getElementById('btnPractical');
function activatePractical(e){e.preventDefault();e.stopPropagation();practicalSpelling=!practicalSpelling;showMotionFromTriadChange();render()}
practicalButton.addEventListener('click',activatePractical);
['Up','Right','Down','Left'].forEach(name=>{
  const btn=document.getElementById('btn'+name);
  btn.addEventListener('click',e=>{
    e.stopPropagation();
    if(name==='Up')applyMajorButtonClick();
    else applyDirection(name.toLowerCase());
  });
  btn.addEventListener('pointerdown',e=>e.stopPropagation());
  btn.addEventListener('pointerup',e=>e.stopPropagation());
});
// Press-and-hold any draggable object for 0.3 seconds to move it independently.
function enableDrag(wrap,delay,options={}){
  let timer=null,drag=false,pid=null,sx=0,sy=0,ox=0,oy=0,suppressClick=false;
  const centerX=!!options.centerX;
  const capture=!!options.capture;
  function centeredLeft(el){return Math.max(0,(innerWidth-el.offsetWidth)/2)}
  wrap.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;
    const r=wrap.getBoundingClientRect();ox=r.left;oy=r.top;drag=false;
    timer=setTimeout(()=>{
      drag=true;window.__triadDragging=true;
      wrap.classList.add('dragging');
      if(options.preventClickAfterDrag)suppressClick=true;
      wrap.style.position='fixed';
      wrap.style.left=(centerX?centeredLeft(wrap):ox)+'px';
      wrap.style.top=oy+'px';wrap.style.right='auto';wrap.style.bottom='auto';
      wrap.style.width=`${r.width}px`;wrap.style.height=`${r.height}px`;
      wrap.style.zIndex='40';wrap.style.transform='none';
      wrap.setPointerCapture(pid);
    },delay);
  },capture);
  wrap.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid)return;
    if(!drag){
      if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8){clearTimeout(timer);timer=null}
      return;
    }
    e.preventDefault();
    const x=centerX?centeredLeft(wrap):Math.max(0,Math.min(innerWidth-wrap.offsetWidth,ox+e.clientX-sx));
    const y=Math.max(0,Math.min(innerHeight-wrap.offsetHeight,oy+e.clientY-sy));
    wrap.style.left=x+'px';wrap.style.top=y+'px';
  },capture);
  function end(e){
    if(e.pointerId!==pid)return;
    clearTimeout(timer);timer=null;
    if(drag&&centerX)wrap.style.left=centeredLeft(wrap)+'px';
    if(drag)window.__triadDragging=false;
    if(drag)wrap.classList.remove('dragging');
    drag=false;pid=null;
  }
  wrap.addEventListener('pointerup',end,capture);
  wrap.addEventListener('pointercancel',end,capture);
  if(options.preventClickAfterDrag){
    wrap.addEventListener('click',e=>{
      if(!suppressClick)return;
      e.preventDefault();e.stopPropagation();suppressClick=false;
    },true);
  }
  if(centerX){
    const recenter=()=>{
      if(wrap.style.position==='fixed'||wrap.id==='topWrap'||wrap.id==='bottomWrap'){
        wrap.style.left=centeredLeft(wrap)+'px';
      }
    };
    window.addEventListener('resize',recenter);setTimeout(recenter,0);
  }
}
enableDrag(document.getElementById('topWrap'),300,{centerX:true});enableDrag(document.getElementById('bottomWrap'),300,{centerX:true});
// Move the complete arrow/reset/practical control cluster after a stationary 0.5-second hold.
const swipePad=document.querySelector('.swipe-pad');
enableDrag(swipePad,500,{capture:true,preventClickAfterDrag:true});
// Circle hold-drag after a stationary half-second hold.
const wheelWrap=document.querySelector('.key-wheel-wrap');enableDrag(wheelWrap,500,{preventClickAfterDrag:true});
