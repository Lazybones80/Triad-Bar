<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101319"><title>Triad Bar</title>
<style>
:root{color-scheme:dark;--bg:#101319;--panel:#0d111a;--blue:#438bff;--fg:#f5f8ff;--cell:34px;--font:15px;--line:.5px;--pad:8px}

*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{width:100%;height:100%;background:var(--bg)}

.key-wheel-wrap{display:none!important;position:fixed;z-index:30;left:50%;top:calc(50% - 86.25px);bottom:auto;transform:translateX(-50%);width:172.5px;display:flex;flex-direction:column;align-items:stretch;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.key-wheel-wrap.dragging{cursor:grabbing}

.mode-indicator{display:none!important}

.bars-area{position:fixed;inset:0;z-index:10;pointer-events:none}
.bar-wrap{position:fixed;width:calc(100% - 16px);left:8px;right:auto;touch-action:none;pointer-events:auto;user-select:none;-webkit-user-select:none}
#topWrap{top:min(calc(50% + 193px),calc(100% - 124px))}
#bottomWrap{top:max(8px,calc(50% - 361px))}
.chord-labels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));width:100%;height:30px;align-items:center;margin-bottom:2px;color:#f5f8ff;font-size:var(--font);font-weight:500;text-align:center;line-height:1}
.chord-label{display:block;min-width:0;width:100%;height:100%;position:relative;overflow:visible;white-space:nowrap}
.label-root-acc.angled{transform:translateY(-50%) rotate(-30deg)}
.label-root-acc{position:absolute;left:25%;top:50%;margin-left:0;transform:translateY(-50%);display:inline-flex;align-items:center;justify-content:flex-start;white-space:nowrap}
.label-root{display:inline-block;flex:0 0 auto;width:auto;text-align:left;line-height:1}
.label-acc{display:inline-block;line-height:1;margin-left:.02em}
.label-acc:empty{margin-left:0}
.label-suffix{display:inline-block;font-size:.9em;line-height:1;white-space:nowrap;margin-left:.03em}
.sus-word{font-size:calc(1em - 3px)}
.sus-num{line-height:1;font-size:calc(1em - 4px)}
.label-suffix.compact-altered-sus{font-size:.9em}
.triad-bar{display:grid;width:100%;background:var(--panel);border:.75px solid var(--blue);border-right:1px solid var(--blue);grid-template-columns:repeat(var(--groups),minmax(0,1fr));}

.triad-group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-width:0;border-right:.75px solid var(--blue)}
.triad-group:last-child{border-right:0}
.note-stack,.acc-stack{display:grid;grid-template-rows:repeat(3,var(--cell));min-width:0}
.note-stack{border-right:.75px solid var(--blue)}
.acc-stack{border-right:.5px solid var(--blue)}
.triad-cell{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;white-space:nowrap;font-size:var(--font);line-height:1;font-weight:500;border-bottom:.5px solid var(--blue);color:var(--fg);padding:0 1px}
.triad-cell:last-child{border-bottom:0}
.acc-stack .triad-cell{font-size:var(--font)}
.blank{color:transparent!important}
.double-accidental{color:#ff5a66!important}
@media(max-width:390px){.motion-indicator .formula-cell{font-size:calc(var(--font)*.8)!important}.bars-area{gap:14px}.triad-cell{padding:0}.acc-stack .triad-cell{font-size:var(--font)}}

.swipe-pad{position:fixed;right:18px;top:calc(50% - 70px);transform:none;width:174px;height:133px;display:grid;grid-template-columns:repeat(4,39px);grid-template-rows:repeat(3,39px);justify-content:center;align-content:center;column-gap:6px;row-gap:8px;z-index:35;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}

.swipe-btn{position:relative;justify-self:center;align-self:center;width:39px;height:39px;background:linear-gradient(145deg,#78a2ff 0%,#4d7ee8 52%,#3566c8 100%);border:1px solid #86aaff;border-radius:11px;padding:0;margin:0;outline:none;display:flex;align-items:center;justify-content:center;color:#fff;line-height:1;font-family:Arial,sans-serif;box-shadow:inset 2px 2px 4px #ffffff55,inset -3px -3px 5px #183d8d88,0 6px 10px #0008;transition:transform .08s,box-shadow .08s}

.swipe-btn:active{transform:translateY(3px);box-shadow:inset 2px 2px 4px #ffffff44,inset -2px -2px 4px #183d8d88,0 3px 6px #0008}

.swipe-btn.active{border-color:#d4d8e0;box-shadow:inset 2px 2px 4px #ffffff33,inset -3px -3px 5px #183d8d88,0 0 0 1px #d4d8e0,0 7px 14px #0009}

.motion-indicator{position:absolute;left:calc(50% - var(--cell));top:calc(-3 * var(--cell) - 11px);width:calc(2 * var(--cell));height:calc(3 * var(--cell));display:grid;grid-template-columns:repeat(2,var(--cell));grid-template-rows:repeat(3,var(--cell));background:var(--panel);border:.75px solid var(--blue);border-radius:0;overflow:hidden;box-shadow:none;pointer-events:none}
.motion-cell{display:flex;align-items:center;justify-content:center;border-right:.5px solid var(--blue);border-bottom:.5px solid var(--blue);color:#fff;font-size:22px;font-weight:800;line-height:1;text-shadow:none;min-width:0;min-height:0}
.motion-square{display:inline-block;width:.72em;height:.72em;border-radius:.12em;background:#fff}
.motion-triangle-pair{display:inline-flex;align-items:center;justify-content:center;gap:0;max-width:100%;white-space:nowrap}
.motion-triangle{display:inline-block;font-size:22px;line-height:1;font-weight:900;transform:scaleX(.95);flex:0 0 auto;color:#fff}
.motion-cell.double-motion,.formula-cell.double-motion,.double-motion .motion-triangle{color:var(--blue)!important}
.motion-arrow-cell{grid-column:2;border-right:0}
.formula-cell{grid-column:1;font-family:inherit;font-size:calc(var(--font)*.86)!important;font-weight:500!important;line-height:1;border-right:.5px solid var(--blue)}
.motion-cell[style*="grid-row:3"]{border-bottom:0}
.motion-middle{font-size:21px}
.swipe-btn.sus2{grid-column:4;grid-row:1}
.swipe-btn.sus4{grid-column:1;grid-row:2}
.swipe-btn.aug{grid-column:3;grid-row:2}
.swipe-btn.dim{grid-column:4;grid-row:2}
.swipe-btn .btn-label{position:relative;z-index:1;display:block;text-align:center;color:#fff;font-size:15px;font-weight:800;line-height:1;letter-spacing:0;white-space:nowrap;pointer-events:none;text-shadow:0 2px 2px #16336bcc}

.swipe-btn.up{left:auto;right:auto;top:auto;bottom:auto;grid-column:2;grid-row:1}

.swipe-btn.down{left:auto;right:auto;top:auto;bottom:auto;grid-column:2;grid-row:2}

.swipe-btn.left{left:auto;right:auto;top:auto;bottom:auto;grid-column:1;grid-row:1}

.swipe-btn.right{left:auto;right:auto;top:auto;bottom:auto;grid-column:3;grid-row:1}

.reset-btn{position:relative;left:auto;top:auto;justify-self:center;align-self:center;grid-column:2;grid-row:3;width:33px;height:33px;border-radius:10px;border:1px solid #91b2ff;background:linear-gradient(145deg,#405b88,#202d47);color:#dce7ff;font-size:10px;font-weight:800;line-height:1;box-shadow:inset 2px 2px 4px #ffffff22,inset -3px -3px 5px #0008,0 3px 0 #080d17,0 5px 9px #0008;cursor:pointer}

.practical-btn{z-index:50;pointer-events:auto;touch-action:manipulation;position:relative;left:auto;top:auto;justify-self:center;align-self:center;grid-column:3;grid-row:3;width:33px;height:33px;border-radius:10px;border:1px solid #91b2ff;background:linear-gradient(145deg,#405b88,#202d47);color:#dce7ff;font-size:10px;font-weight:800;line-height:1;box-shadow:inset 2px 2px 4px #ffffff22,inset -3px -3px 5px #0008,0 3px 0 #080d17,0 5px 9px #0008;cursor:pointer}
.practical-btn.active{border-color:#d4d8e0;box-shadow:inset 2px 2px 4px #ffffff44,inset -3px -3px 5px #0008,0 0 0 1px #d4d8e0}
.practical-btn:active{transform:translateY(2px)}

.reset-btn:active{transform:translateY(2px);box-shadow:inset 2px 2px 4px #ffffff18,inset -2px -2px 4px #0008,0 1px 0 #080d17,0 3px 6px #0008}

/* CoF wheel and chart drag handle. Keep the wheel at its original 172.5px canvas size. */
.key-wheel-wrap{display:flex!important;width:172.5px;height:172.5px;position:fixed;z-index:30;left:50%;top:calc(50% - 86.25px);bottom:auto;transform:translateX(-50%);align-items:stretch;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;filter:drop-shadow(0 9px 15px #000b)}

.key-wheel-wrap.dragging,.swipe-pad.dragging{cursor:grabbing}

.motion-indicator{pointer-events:auto;cursor:grab}

.swipe-pad{cursor:grab}

/* Flat wheel layout: the wheel, formula, and controls occupy separate columns. */
.key-wheel-wrap{width:224.25px;height:224.25px;left:18px;top:calc(50% - 148.6px);transform:none;filter:drop-shadow(0 12px 18px #000b)}

.motion-indicator{position:fixed;left:calc(50% + 74.7px);top:calc(50% - 156.6px);z-index:26;pointer-events:auto;cursor:grab}

.swipe-pad{right:36px;top:calc(50% + 27.7px)}
/* No text selection, carets, callout menus or magnifier loupes anywhere */
html,body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;caret-color:transparent}

::selection{background:transparent}

::-moz-selection{background:transparent}
/* Two-ring circle of fifths: major keys outside, relative minors inside. */
.wheel-disc{position:relative;width:100%;height:100%;display:block;border-radius:50%;background:#111419;flex:none;overflow:visible}
#keyWheel{position:relative;width:100%;height:100%;display:block;overflow:visible}
.wheel-base{fill:#111419;stroke:#2a2c32;stroke-width:.25}
.wheel-sector{cursor:pointer;stroke:#0a0b0d;stroke-width:.26;stroke-linejoin:round}
.wheel-label{paint-order:stroke;stroke:rgba(0,0,0,.4);stroke-width:.5px;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.wheel-label.outer{font-size:6.1px}.wheel-label.inner{font-size:4.9px}
.wheel-select{fill:none;stroke:#fff;stroke-width:.65;stroke-dasharray:2.05 1.95;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.wheel-center{fill:url(#wheelCenterGradient);stroke:#08090b;stroke-width:.5}
.wheel-center-ring{fill:none;stroke:#d6544a;stroke-width:.5;pointer-events:none}
.wheel-center-label{fill:#ca4f45;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
</style></head>
<body><main>
<div class="key-wheel-wrap" aria-label="Circle of fifths key selector"><div class="wheel-disc"><svg id="keyWheel" viewBox="0 0 100 100" role="img" aria-label="Choose a key"></svg></div><div id="modeIndicator" class="mode-indicator" aria-hidden="true"></div></div>
<div class="bars-area" id="barsArea"><div class="bar-wrap" id="topWrap"><div class="chord-labels" id="topLabels" aria-label="Top chord labels"></div><div class="triad-bar" id="topBar" aria-label="Top triad row"></div></div><div class="bar-wrap" id="bottomWrap"><div class="chord-labels" id="bottomLabels" aria-label="Bottom chord labels"></div><div class="triad-bar" id="bottomBar" aria-label="Bottom triad row"></div></div></div>
<div class="motion-indicator" id="motionIndicator" aria-label="Triad formula">
  <div class="motion-cell motion-arrow-cell" id="motionRoot" style="grid-column:2;grid-row:1"></div>
  <div class="motion-cell motion-middle motion-arrow-cell" id="motionThird" style="grid-column:2;grid-row:2"></div>
  <div class="motion-cell motion-arrow-cell" id="motionFifth" style="grid-column:2;grid-row:3"></div>
  <div class="motion-cell formula-cell" id="motionRootLabel" style="grid-column:1;grid-row:1">R</div>
  <div class="motion-cell formula-cell" id="motionThirdLabel" style="grid-column:1;grid-row:2">3</div>
  <div class="motion-cell formula-cell" id="motionFifthLabel" style="grid-column:1;grid-row:3">5</div>
</div><div class="swipe-pad" aria-label="Chord quality and spelling controls">
<button class="swipe-btn left" id="btnLeft" aria-label="Flat"><span class="btn-label">b</span></button>
<button class="swipe-btn up" id="btnUp" aria-label="Major"><span class="btn-label">M</span></button>
<button class="swipe-btn right" id="btnRight" aria-label="Sharp"><span class="btn-label">#</span></button>
<button class="swipe-btn sus2" id="btnSus2" aria-label="Suspended second"><span class="btn-label">sus2</span></button>
<button class="swipe-btn down" id="btnDown" aria-label="Minor"><span class="btn-label">m</span></button>
<button class="swipe-btn sus4" id="btnSus4" aria-label="Suspended fourth"><span class="btn-label">sus4</span></button>
<button class="swipe-btn aug" id="btnAug" aria-label="Augmented"><span class="btn-label">aug</span></button>
<button class="swipe-btn dim" id="btnDim" aria-label="Diminished"><span class="btn-label">dim</span></button>
<button class="reset-btn" id="btnReset" aria-label="Reset">↻</button>
<button class="practical-btn" id="btnPractical" aria-label="Practical chord spelling">♭<br><small>OK</small></button></div></main>
<script>
const fifths=['C','G','D','A','E','B','F♯','D♭','A♭','E♭','B♭','F'];let selectedKey='C',selectedMode='major',isMinor=false; // isMinor is an independent modifier that combines with aug / sus2 / sus4
const groupsTop=[['F','A','C'],['C','E','G'],['G','B','D'],['D','F','A'],['A','C','E'],['E','G','B'],['B','D','F']];const groupsBottom=[['G','B','D'],['C','E','G'],['F','A','C'],['B','D','F'],['E','G','B'],['A','C','E'],['D','F','A']];

function accidentalValue(acc){
  if(!acc) return 0;
  return [...acc].reduce((sum,ch)=>sum+(ch==='♯'?1:ch==='♭'?-1:ch==='𝄪'?2:ch==='𝄫'?-2:0),0);
}
function accidentalText(value){
  return value===2?'𝄪':value===1?'♯':value===-1?'♭':value===-2?'𝄫':value>2?'♯'.repeat(value):value< -2?'♭'.repeat(-value):'';
}
const naturalPitch={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
let rootAlter=0; // 0 natural, +1 sharp, -1 flat
let practicalSpelling=false;
function normalizeAccidental(value){
  // Return the smallest signed semitone alteration (-6 to +6).
  // Do not wrap values such as +3 back into an invalid +3/-9 oscillation.
  let v=((value%12)+12)%12;
  if(v>6)v-=12;
  return v;
}
function triadIntervals(){
  if(selectedMode==='diminished') return [0,3,6];
  if(selectedMode==='sus2') return [0,2,7];
  if(selectedMode==='sus4') return [0,5,7];
  if(selectedMode==='augmented') return isMinor?[0,3,8]:[0,4,8];
  return isMinor?[0,3,7]:[0,4,7];
}
function letterSteps(){
  if(selectedMode==='sus2') return [0,1,4]; // 3rd is replaced by the 2nd
  if(selectedMode==='sus4') return [0,3,4]; // 3rd is replaced by the 4th
  // Letter distance of root/middle/fifth: sus2 uses the 2nd, sus4 the 4th.
  return [0,2,4];
}
function practicalTriad(notes){
  // Preserve the actual root pitch and chord quality, but choose the
  // clearest enharmonic spelling for the root, major/minor third, and fifth.
  const rootPitch=(naturalPitch[notes[0]]+rootAlter+120)%12;
  const intervals=triadIntervals();
  const letters=['C','D','E','F','G','A','B'];
  const chordLetterSteps=letterSteps();
  const candidates=[];

  for(const letter of letters){
    const li=letters.indexOf(letter);
    const rootAcc=normalizeAccidental(rootPitch-naturalPitch[letter]);

    const tones=chordLetterSteps.map((step,i)=>{
      const toneLetter=letters[(li+step)%7];
      const targetPitch=(rootPitch+intervals[i])%12;
      const acc=normalizeAccidental(targetPitch-naturalPitch[toneLetter]);
      return {letter:toneLetter,acc};
    });

    const allAccidentals=[rootAcc,...tones.map(t=>t.acc)];
    const cost=allAccidentals.reduce((sum,acc)=>sum+Math.abs(acc),0);

    // If two spellings are equally simple, retain the original root letter.
    // This keeps F# as F# rather than arbitrarily changing it to Gb.
    const originalLetterPenalty=letter===notes[0]?0:1;

    // As a final tie-break, follow the user's selected sharp/flat direction.
    const directionPenalty=
      rootAlter>0&&rootAcc<0 ? 1 :
      rootAlter<0&&rootAcc>0 ? 1 : 0;

    candidates.push({
      letter,
      rootAcc,
      tones,
      cost,
      originalLetterPenalty,
      directionPenalty
    });
  }

  candidates.sort((a,b)=>
    a.cost-b.cost ||
    a.originalLetterPenalty-b.originalLetterPenalty ||
    a.directionPenalty-b.directionPenalty ||
    a.letter.localeCompare(b.letter)
  );

  return candidates[0];
}
function chordSpelling(notes){
  const rootPitch=(naturalPitch[notes[0]]+rootAlter+120)%12;
  const intervals=triadIntervals();
  const theoretical={letter:notes[0],rootAcc:rootAlter,tones:letterSteps().map((step,i)=>{const letter=['C','D','E','F','G','A','B'][(['C','D','E','F','G','A','B'].indexOf(notes[0])+step)%7];return {letter,acc:normalizeAccidental(rootPitch+intervals[i]-naturalPitch[letter])}})};
  if(!practicalSpelling) return theoretical;
  return practicalTriad(notes);
}
function chordAccidentals(notes){ return chordSpelling(notes).tones.map(t=>accidentalText(t.acc)); }
function chordSuffix(){
  const base=({diminished:'dim',augmented:'+',sus2:'sus2',sus4:'sus4'})[selectedMode]||'';
  if(!isMinor||selectedMode==='diminished') return base;
  return 'm'+base;
}
const wheel=document.getElementById('keyWheel'),indicator=document.getElementById('modeIndicator');function polar(r,a){return{x:50+r*Math.sin(a),y:50-r*Math.cos(a)}}function path(r1,r2,a1,a2){const p1=polar(r2,a1),p2=polar(r2,a2),p3=polar(r1,a2),p4=polar(r1,a1);return`M ${p1.x} ${p1.y} A ${r2} ${r2} 0 0 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${r1} ${r1} 0 0 0 ${p4.x} ${p4.y} Z`}
// Circle of fifths, two rings (outer = major keys, inner = relative minors). One colour per position.
const wheelColors=[ // [label, outer fill, inner fill] in fifths order starting at C
  ['#c85144','#553232','#512e2d'],['#45998a','#284646','#254244'],['#bd7233','#4b3623','#4d3623'],
  ['#4b74c5','#25334f','#293755'],['#b6ab37','#45421e','#4d491d'],['#864eb5','#312241','#3b274c'],
  ['#4ea76b','#1f3b2c','#264233'],['#aa522d','#3b241c','#40281e'],['#448fa1','#1e3940','#243c46'],
  ['#ad8931','#463c1f','#483e22'],['#7f6ac8','#393454','#393355'],['#74a63c','#3a4b2b','#364726']
];
const relativeMinors=['A','E','B','F\u266F','C\u266F','G\u266F','D\u266F','B\u266D','F','C','G','D'];
function shade(hex,f){const n=parseInt(hex.slice(1),16);return '#'+[16,8,0].map(sh=>Math.round(((n>>sh)&255)*f).toString(16).padStart(2,'0')).join('')}
function drawWheel(){
  const ns='http://www.w3.org/2000/svg';
  const create=(tag,attrs={})=>{
    const el=document.createElementNS(ns,tag);
    Object.entries(attrs).forEach(([key,value])=>el.setAttribute(key,value));
    return el;
  };
  const R_OUT=46,R_MID=26,R_IN=14.2,R_DISC=14,R_RING=12.3,R_LABEL_OUT=36,R_LABEL_IN=19.7;
  wheel.innerHTML='';
  const defs=create('defs');
  const grad=create('radialGradient',{id:'wheelCenterGradient',cx:'.42',cy:'.28',r:'.8'});
  grad.appendChild(create('stop',{offset:'0%','stop-color':'#2b2f37'}));
  grad.appendChild(create('stop',{offset:'60%','stop-color':'#15181d'}));
  grad.appendChild(create('stop',{offset:'100%','stop-color':'#0c0d10'}));
  defs.appendChild(grad);
  wheel.appendChild(defs);
  wheel.appendChild(create('circle',{cx:'50',cy:'50',r:'48',class:'wheel-base'}));
  const step=Math.PI*2/12;
  const choose=key=>()=>{selectedKey=key;render()};
  // Sectors: outer ring first, then inner ring.
  fifths.forEach((key,i)=>{
    const p=create('path',{d:path(R_MID,R_OUT,i*step-step/2,i*step+step/2),fill:wheelColors[i][0],class:'wheel-sector'});
    p.addEventListener('click',choose(key));
    wheel.appendChild(p);
  });
  fifths.forEach((key,i)=>{
    const p=create('path',{d:path(R_IN,R_MID,i*step-step/2,i*step+step/2),fill:shade(wheelColors[i][0],.78),class:'wheel-sector'});
    p.addEventListener('click',choose(key));
    wheel.appendChild(p);
  });
  // Labels.
  fifths.forEach((key,i)=>{
    const o=polar(R_LABEL_OUT,i*step),n=polar(R_LABEL_IN,i*step);
    const lo=create('text',{x:o.x,y:o.y,class:'wheel-label outer',fill:'#fff'});lo.textContent=key;wheel.appendChild(lo);
    const li=create('text',{x:n.x,y:n.y,class:'wheel-label inner',fill:'#fff'});li.textContent=relativeMinors[i];wheel.appendChild(li);
  });
  // Centre disc.
  wheel.appendChild(create('circle',{cx:'50',cy:'50',r:R_DISC,class:'wheel-center'}));
  wheel.appendChild(create('circle',{cx:'50',cy:'50',r:R_RING,class:'wheel-center-ring'}));
  const centerLabel=create('text',{x:'50',y:'49.4',class:'wheel-center-label','font-size':selectedKey.length>1?'8.4':'9.2'});
  centerLabel.textContent=selectedKey;
  wheel.appendChild(centerLabel);
  // Dashed outline around the selected key (outer sector and its relative-minor sector).
  const si=fifths.indexOf(selectedKey);
  if(si>=0){
    wheel.appendChild(create('path',{d:path(R_MID,R_OUT,si*step-step/2,si*step+step/2),class:'wheel-select'}));
    wheel.appendChild(create('path',{d:path(R_IN,R_MID,si*step-step/2,si*step+step/2),class:'wheel-select'}));
  }
}
function makeBar(el,groups){el.style.setProperty('--groups',groups.length);el.innerHTML='';groups.forEach(notes=>{const group=document.createElement('div');group.className='triad-group';const ns=document.createElement('div');ns.className='note-stack';const as=document.createElement('div');as.className='acc-stack';notes.forEach(letter=>{const n=document.createElement('div');n.className='triad-cell';n.textContent=letter;ns.appendChild(n);const a=document.createElement('div');a.className='triad-cell accidental';as.appendChild(a)});group.append(ns,as);el.appendChild(group)})}

function renderChordLabels(el,groups){
  el.innerHTML='';
  groups.forEach(notes=>{
    const label=document.createElement('div');
    label.className='chord-label';

    const rootAcc=document.createElement('span');
    rootAcc.className='label-root-acc';

    const root=document.createElement('span');
    root.className='label-root';

    const spelling=chordSpelling(notes);
    root.textContent=spelling.letter;

    const acc=document.createElement('span');
    acc.className='label-acc';
    acc.textContent=accidentalText(spelling.rootAcc);

    const suffix=document.createElement('span');
    suffix.className='label-suffix';
    // Shrink sus2/sus4 only when the displayed chord root has a sharp or flat.
    if((selectedMode==='sus2'||selectedMode==='sus4') && spelling.rootAcc!==0){
      suffix.classList.add('compact-altered-sus');
    }
    const sfx=chordSuffix();
    const susMatch=/^(m?)sus([24])$/.exec(sfx);
    if(susMatch){
      suffix.append(susMatch[1]);
      const sus=document.createElement('span');
      sus.className='sus-word';
      sus.textContent='sus';
      const num=document.createElement('span');
      num.className='sus-num';
      num.textContent=susMatch[2];
      suffix.classList.add('has-sus');
      suffix.append(sus,num);
    }else suffix.textContent=sfx;

    rootAcc.append(root,acc,suffix);
    label.appendChild(rootAcc);
    el.appendChild(label);
  });
}
// Centre each chord root exactly over its chord column; accidental and suffix follow to its right.

function applyChordAccidentals(el,groups){
  [...el.querySelectorAll('.triad-group')].forEach((group,i)=>{

    const accidentalCells=group.querySelectorAll('.acc-stack .triad-cell');
    spelling.tones.forEach((tone,j)=>{

function showMotionFromTriadChange(){
  // Each block adds two sources: the sharp/flat root shift and the chord quality.
  // Opposite moves cancel to a white square; the same direction twice is a blue arrow.
  const quality=[
    0,
    selectedMode==='sus2'?-2:selectedMode==='sus4'?1:(selectedMode==='diminished'||isMinor?-1:0), // semitones vs a major 3rd: sus2 drops two, sus4 rises one
    selectedMode==='diminished'?-1:selectedMode==='augmented'?1:0
  ];
  const selectedFormula=quality.map(q=>q+rootAlter);          // net movement vs the natural-root major triad
  const cancelled=quality.map(q=>q!==0&&rootAlter!==0&&q+rootAlter===0); // e.g. # + m on the 3rd: back to where it started
  const doubled=selectedFormula.map(n=>Math.abs(n)>1);                  // two or more steps in one block
  const ids=['motionRoot','motionThird','motionFifth'];
  const labelIds=['motionRootLabel','motionThirdLabel','motionFifthLabel'];

  ids.forEach((id,index)=>{
    const cell=document.getElementById(id);
    const label=document.getElementById(labelIds[index]);
    if(!cell)return;
    const movement=selectedFormula[index];
    // Render one full-size arrow for every moving triad tone.
    const count=Math.min(1,Math.abs(movement));
    const glyph=movement>0?'▲':'▼';
    cell.replaceChildren();
    const isDoubleMovement=doubled[index];
    cell.classList.toggle('double-motion',isDoubleMovement);
    if(label)label.classList.toggle('double-motion',isDoubleMovement);
    if(cancelled[index]){const sq=document.createElement('span');sq.className='motion-square';cell.appendChild(sq);return}
    if(count===0)return;
    const pair=document.createElement('span');
    pair.className='motion-triangle-pair';
    for(let n=0;n<count;n++){
      const triangle=document.createElement('span');
      triangle.className='motion-triangle';
      triangle.textContent=glyph;
      pair.appendChild(triangle);
    }
    cell.appendChild(pair);
  });
}
function applyMajorButtonClick(){
  // A direct tap on M is the full default reset: natural-root major.
  // This is intentionally different from swiping up, which only changes
  // chord quality and preserves an active flat or sharp.
  // M only switches the minor modifier off; aug/dim/sus and sharp/flat are left untouched.
  isMinor=false;
  showMotionFromTriadChange();
  render();
}
function applyDirection(dir){
  const previousMode=selectedMode,previousAlter=rootAlter;
  if(dir==='up'){
    // M changes chord quality only. Preserve the current flat/natural/sharp triad type.
    isMinor=false;
  }else if(dir==='down'){
    // Clicking the active minor button returns to the default major mode.
    isMinor=!isMinor;
  }else if(dir==='right'){
    // Direct button press: sharp toggles back to natural when already active.
    rootAlter = rootAlter === 1 ? 0 : 1;
  }else if(dir==='left'){
    // Direct button press: flat toggles back to natural when already active.
    rootAlter = rootAlter === -1 ? 0 : -1;
  }
  showMotionFromTriadChange();
  render();
}

// Swipes move one position at a time across the horizontal controls:
// flat <-> natural/major <-> sharp. The indicator reflects the resulting
// strongest accidental in the rendered triad rows, not the physical swipe gesture.
function applySwipeDirection(dir){
  const previousMode=selectedMode,previousAlter=rootAlter;
  if(dir==='right'){
    rootAlter = Math.min(1, rootAlter + 1);
  }else if(dir==='left'){
    rootAlter = Math.max(-1, rootAlter - 1);
  }else{
    applyDirection(dir);
    return;
  }
  showMotionFromTriadChange();
  render();
}

let swipe=null;

  // Button taps are handled by their own click listeners, never as swipe gestures.
  if(e.target instanceof Element && (e.target.closest('button') || e.target.closest('.swipe-pad'))){

  if(Math.abs(dy)>=Math.abs(dx)){
    applyDirection(dy<0?'up':'down');

  }

// Press-and-hold any draggable object for 0.3 seconds to move it independently.
function enableDrag(wrap,delay,options={}){

    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(options.blocked&&options.blocked())return;

      wrap.style.top=oy+'px';wrap.style.right='auto';wrap.style.bottom='auto';
      wrap.style.width=`${r.width}px`;wrap.style.height=`${r.height}px`;

      return;
    }
    e.preventDefault();
    const x=centerX?centeredLeft(wrap):Math.max(0,Math.min(innerWidth-wrap.offsetWidth,ox+e.clientX-sx));
    const y=Math.max(0,Math.min(innerHeight-wrap.offsetHeight,oy+e.clientY-sy));
    wrap.style.left=x+'px';wrap.style.top=y+'px';
  },capture);
  function end(e){
    if(e.pointerId!==pid)return;
    clearTimeout(timer);timer=null;
    if(drag&&centerX)wrap.style.left=centeredLeft(wrap)+'px';
    if(drag)window.__triadDragging=false;
    if(drag)wrap.classList.remove('dragging');

  }

    },true);
  }

  }
  return {cancel};
}

// Pinch or spread two fingers on the circle of fifths to resize it: never smaller than its

  const BASE=172.5,MIN_SCALE=1,MAX_SCALE=1.3;
  const pts=new Map();

    next=Math.max(MIN_SCALE,Math.min(MAX_SCALE,next));
    if(next===wheelScale)return;
    const r=wheelWrap.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,size=BASE*next;
    const left=Math.max(0,Math.min(innerWidth-size,cx-size/2)),top=Math.max(0,Math.min(innerHeight-size,cy-size/2));
    Object.assign(wheelWrap.style,{position:'fixed',left:left+'px',top:top+'px',right:'auto',bottom:'auto',transform:'none',width:size+'px',height:size+'px'});
