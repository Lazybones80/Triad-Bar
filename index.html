<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101319"><title>Triad Bar</title>
<style>
:root{color-scheme:dark;--bg:#101319;--panel:#0d111a;--blue:#438bff;--fg:#f5f8ff;--cell:34px;--font:15px;--line:.5px;--pad:8px}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}main{width:100%;height:100%;background:var(--bg)}
.key-wheel-wrap{display:none!important;position:fixed;z-index:30;left:50%;top:calc(50% - 86.25px);bottom:auto;transform:translateX(-50%);width:172.5px;display:flex;flex-direction:column;align-items:stretch;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}.key-wheel-wrap.dragging{cursor:grabbing}.wheel-disc{width:172.5px;height:172.5px;display:grid;place-items:center;border-radius:50%;background:rgba(16,19,25,.96);border:.5px solid var(--blue);box-shadow:0 2px 8px #0008;flex:none}#keyWheel{width:100%;height:100%;display:block;overflow:visible}.wheel-sector{cursor:pointer;stroke:var(--blue);stroke-width:.2}.wheel-sector.active{stroke:var(--blue);stroke-width:.625}.wheel-label{fill:#f3f5fa;font-size:8px;font-weight:700;text-anchor:middle;dominant-baseline:middle;pointer-events:none}.wheel-center{fill:#161b24;stroke:var(--blue);stroke-width:.325}.wheel-center-label{fill:#ff6862;font-size:10px;font-weight:800;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.mode-indicator{display:none!important}
.bars-area{position:fixed;inset:0;z-index:10;pointer-events:none}.bar-wrap{position:fixed;width:calc(100% - 16px);left:8px;right:auto;touch-action:none;pointer-events:auto;user-select:none;-webkit-user-select:none}#topWrap{top:9%}#bottomWrap{top:72%}.chord-labels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));width:100%;height:30px;align-items:center;margin-bottom:2px;color:#f5f8ff;font-size:var(--font);font-weight:500;text-align:center;line-height:1}.chord-label{display:block;min-width:0;width:100%;height:100%;position:relative;overflow:visible;white-space:nowrap}.label-root-acc{position:absolute;left:32.26%;top:50%;width:1em;height:1em;transform:translate(-50%,-50%);display:block;white-space:nowrap}.label-root{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;white-space:nowrap}.label-acc{position:absolute;left:calc(50% + .5em);top:50%;transform:translateY(-50%);display:block;white-space:nowrap}.label-suffix{position:absolute;left:calc(50% + .62em);top:50%;transform:translateY(-50%);display:block;font-size:.9em;line-height:1;white-space:nowrap;margin:0}.triad-bar{display:grid;width:100%;background:var(--panel);border:.75px solid var(--blue);border-right:1px solid var(--blue);grid-template-columns:repeat(var(--groups),minmax(0,1fr));}
.triad-group{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,.55fr);min-width:0;border-right:.75px solid var(--blue)}.triad-group:last-child{border-right:0}.note-stack,.acc-stack{display:grid;grid-template-rows:repeat(3,var(--cell));min-width:0}.note-stack{border-right:.75px solid var(--blue)}.acc-stack{border-right:.5px solid var(--blue)}.triad-cell{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;white-space:nowrap;font-size:var(--font);line-height:1;font-weight:500;border-bottom:.5px solid var(--blue);color:var(--fg);padding:0 1px}.triad-cell:last-child{border-bottom:0}.acc-stack .triad-cell{font-size:calc(var(--font)*.86)}.blank{color:transparent!important}
@media(max-width:390px){.bars-area{gap:14px}.triad-cell{padding:0}.acc-stack .triad-cell{font-size:calc(var(--font)*.8)}}
.swipe-pad{position:fixed;right:12px;top:50%;transform:translateY(-50%);width:117px;height:117px;z-index:26;pointer-events:auto;touch-action:manipulation}
.swipe-btn{position:absolute;width:39px;height:39px;background:linear-gradient(145deg,#78a2ff 0%,#4d7ee8 52%,#3566c8 100%);border:1px solid #86aaff;border-radius:11px;padding:0;margin:0;outline:none;display:flex;align-items:center;justify-content:center;color:#fff;line-height:1;font-family:Arial,sans-serif;box-shadow:inset 2px 2px 4px #ffffff55,inset -3px -3px 5px #183d8d88,0 4px 0 #244b9e,0 6px 10px #0008;transition:transform .08s,box-shadow .08s}
.swipe-btn:active{transform:translateY(3px);box-shadow:inset 2px 2px 4px #ffffff44,inset -2px -2px 4px #183d8d88,0 1px 0 #244b9e,0 3px 6px #0008}
.swipe-btn.active{border-color:#fff;box-shadow:inset 2px 2px 4px #ffffff66,inset -3px -3px 5px #183d8d88,0 0 0 2px #8fb5ff,0 0 14px #568cff,0 4px 0 #244b9e,0 7px 14px #0009}
.swipe-btn .btn-label{position:relative;z-index:1;display:block;text-align:center;color:#fff;font-size:15px;font-weight:800;line-height:1;letter-spacing:0;white-space:nowrap;pointer-events:none;text-shadow:0 2px 2px #16336bcc}
.swipe-btn.up{left:39px;top:0}
.swipe-btn.down{left:39px;bottom:0}
.swipe-btn.left{left:0;top:39px}
.swipe-btn.right{right:0;top:39px}
.reset-btn{position:absolute;left:42px;top:42px;width:33px;height:33px;border-radius:50%;border:1px solid #9bb9ff;background:linear-gradient(145deg,#27344d,#151d2c);color:#dce7ff;font-size:19px;font-weight:800;letter-spacing:0;line-height:1;box-shadow:inset 2px 2px 4px #ffffff22,inset -3px -3px 5px #0008,0 3px 0 #080d17,0 5px 9px #0008;cursor:pointer}
.practical-btn{z-index:50;pointer-events:auto;touch-action:manipulation;position:absolute;left:42px;top:126px;width:33px;height:33px;border-radius:10px;border:1px solid #91b2ff;background:linear-gradient(145deg,#405b88,#202d47);color:#dce7ff;font-size:10px;font-weight:800;line-height:1;box-shadow:inset 2px 2px 4px #ffffff22,inset -3px -3px 5px #0008,0 3px 0 #080d17,0 5px 9px #0008;cursor:pointer}.practical-btn.active{border-color:#fff;box-shadow:inset 2px 2px 4px #ffffff44,inset -3px -3px 5px #0008,0 0 0 2px #8fb5ff,0 0 12px #568cff,0 3px 0 #080d17}.practical-btn:active{transform:translateY(2px)}
.reset-btn:active{transform:translateY(2px);box-shadow:inset 2px 2px 4px #ffffff18,inset -2px -2px 4px #0008,0 1px 0 #080d17,0 3px 6px #0008}
</style></head>
<body><main>
<div class="key-wheel-wrap" aria-label="Circle of fifths key selector"><div class="wheel-disc"><svg id="keyWheel" viewBox="0 0 100 100" role="img" aria-label="Choose a key"></svg></div><div id="modeIndicator" class="mode-indicator" aria-hidden="true"></div></div>
<div class="bars-area" id="barsArea"><div class="bar-wrap" id="topWrap"><div class="chord-labels" id="topLabels" aria-label="Top chord labels"></div><div class="triad-bar" id="topBar" aria-label="Top triad row"></div></div><div class="bar-wrap" id="bottomWrap"><div class="chord-labels" id="bottomLabels" aria-label="Bottom chord labels"></div><div class="triad-bar" id="bottomBar" aria-label="Bottom triad row"></div></div></div>
<div class="swipe-pad" aria-label="Swipe controls"><button class="swipe-btn up" id="btnUp" aria-label="Sharp"><span class="btn-label">#</span></button><button class="swipe-btn right" id="btnRight" aria-label="Major"><span class="btn-label">M</span></button><button class="swipe-btn down" id="btnDown" aria-label="Flat"><span class="btn-label">b</span></button><button class="swipe-btn left" id="btnLeft" aria-label="Minor"><span class="btn-label">m</span></button><button class="reset-btn" id="btnReset" aria-label="Reset">↻</button><button class="practical-btn" id="btnPractical" aria-label="Practical chord spelling">♭<br><small>OK</small></button></div></main>
<script>
const fifths=['C','G','D','A','E','B','F♯','D♭','A♭','E♭','B♭','F'];const colors=['#9b3d3a','#287a75','#a76a36','#365b91','#7a8030','#68408c','#286a4e','#a16a35','#28717c','#9a7930','#59448e','#4e7334'];let selectedKey='C',selectedMode='major';
const groupsTop=[['F','A','C'],['C','E','G'],['G','B','D'],['D','F','A'],['A','C','E'],['E','G','B'],['B','D','F']];const groupsBottom=[['G','B','D'],['C','E','G'],['F','A','C'],['B','D','F'],['E','G','B'],['A','C','E'],['D','F','A']];

function accidentalValue(acc){
  if(!acc) return 0;
  return [...acc].reduce((sum,ch)=>sum+(ch==='♯'?1:ch==='♭'?-1:ch==='𝄪'?2:ch==='𝄫'?-2:0),0);
}
function accidentalText(value){
  return value===2?'𝄪':value===1?'♯':value===-1?'♭':value===-2?'𝄫':value>2?'♯'.repeat(value):value< -2?'♭'.repeat(-value):'';
}
const naturalPitch={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
let rootAlter=0; // 0 natural, +1 sharp, -1 flat
let practicalSpelling=false;
function normalizeAccidental(value){
  let v=((value+6)%12)-6;
  if(v>2)v-=12; if(v<-2)v+=12;
  return v;
}
function triadIntervals(){
  if(selectedMode==='minor') return [0,3,7];
  if(selectedMode==='diminished') return [0,3,6];
  if(selectedMode==='augmented') return [0,4,8];
  return [0,4,7];
}
function practicalTriad(notes){
  const rootPitch=(naturalPitch[notes[0]]+rootAlter+120)%12;
  const intervals=triadIntervals();
  const letters=['C','D','E','F','G','A','B'];
  const rootIndex=letters.indexOf(notes[0]);
  const candidates=[];
  for(const letter of letters){
    const rootAcc=normalizeAccidental(rootPitch-naturalPitch[letter]);
    const li=letters.indexOf(letter);
    const tones=[0,1,2].map((step,i)=>{
      const toneLetter=letters[(li+step)%7];
      const acc=normalizeAccidental(rootPitch+intervals[i]-naturalPitch[toneLetter]);
      return {letter:toneLetter,acc};
    });
    const cost=Math.abs(rootAcc)+tones.reduce((n,t)=>n+Math.abs(t.acc),0);
    candidates.push({letter,rootAcc,tones,cost});
  }
  candidates.sort((a,b)=>a.cost-b.cost || Math.abs(a.acc)-Math.abs(b.acc));
  return candidates[0];
}
function chordSpelling(notes){
  const rootPitch=(naturalPitch[notes[0]]+rootAlter+120)%12;
  const intervals=triadIntervals();
  const theoretical={letter:notes[0],rootAcc:rootAlter,tones:notes.map((letter,i)=>({letter,acc:normalizeAccidental(rootPitch+intervals[i]-naturalPitch[letter])}))};
  if(!practicalSpelling) return theoretical;
  return practicalTriad(notes);
}
function chordAccidentals(notes){ return chordSpelling(notes).tones.map(t=>accidentalText(t.acc)); }
function chordSuffix(){return selectedMode==='minor'?'m':'';}
const wheel=document.getElementById('keyWheel'),indicator=document.getElementById('modeIndicator');function polar(r,a){return{x:50+r*Math.sin(a),y:50-r*Math.cos(a)}}function path(r1,r2,a1,a2){const p1=polar(r2,a1),p2=polar(r2,a2),p3=polar(r1,a2),p4=polar(r1,a1);return`M ${p1.x} ${p1.y} A ${r2} ${r2} 0 0 1 ${p2.x} ${p2.y} L ${p3.x} ${p3.y} A ${r1} ${r1} 0 0 0 ${p4.x} ${p4.y} Z`}
function drawWheel(){wheel.innerHTML='';const step=Math.PI*2/12;fifths.forEach((key,i)=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',path(18,47,i*step-step/2,i*step+step/2));p.setAttribute('fill',colors[i]);p.setAttribute('class','wheel-sector'+(key===selectedKey?' active':''));p.addEventListener('click',()=>{selectedKey=key;render()});wheel.appendChild(p);const q=polar(38,i*step),t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',q.x);t.setAttribute('y',q.y);t.setAttribute('class','wheel-label');t.textContent=key;wheel.appendChild(t)});const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',50);c.setAttribute('cy',50);c.setAttribute('r',16);c.setAttribute('class','wheel-center');wheel.appendChild(c);const t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',50);t.setAttribute('y',50);t.setAttribute('class','wheel-center-label');t.textContent=selectedKey;wheel.appendChild(t)}
function makeBar(el,groups){el.style.setProperty('--groups',groups.length);el.innerHTML='';groups.forEach(notes=>{const group=document.createElement('div');group.className='triad-group';const ns=document.createElement('div');ns.className='note-stack';const as=document.createElement('div');as.className='acc-stack';notes.forEach(letter=>{const n=document.createElement('div');n.className='triad-cell';n.textContent=letter;ns.appendChild(n);const a=document.createElement('div');a.className='triad-cell accidental';as.appendChild(a)});group.append(ns,as);el.appendChild(group)})}

function renderChordLabels(el,groups){
  el.innerHTML='';
  groups.forEach(notes=>{
    const label=document.createElement('div');
    label.className='chord-label';
    const rootAcc=document.createElement('span');
    rootAcc.className='label-root-acc';
    const root=document.createElement('span');
    root.className='label-root';
    const spelling=chordSpelling(notes);
    root.textContent=spelling.letter;
    const acc=document.createElement('span');
    acc.className='label-acc';
    acc.textContent=accidentalText(spelling.rootAcc);
    const suffix=document.createElement('span');
    suffix.className='label-suffix';
    suffix.textContent=chordSuffix();
    rootAcc.append(root,acc);
    label.append(rootAcc,suffix);
    el.appendChild(label);
  });
}
function applyChordAccidentals(el,groups){
  [...el.querySelectorAll('.triad-group')].forEach((group,i)=>{
    const spelling=chordSpelling(groups[i]);
    const noteCells=group.querySelectorAll('.note-stack .triad-cell');
    const accidentalCells=group.querySelectorAll('.acc-stack .triad-cell');
    spelling.tones.forEach((tone,j)=>{
      noteCells[j].textContent=tone.letter;
      accidentalCells[j].textContent=accidentalText(tone.acc)||'';
    });
  });
}
function render(){
  indicator.textContent=`${selectedKey} ${selectedMode}`;
  drawWheel();
  applyChordAccidentals(document.getElementById('topBar'),groupsTop);
  applyChordAccidentals(document.getElementById('bottomBar'),groupsBottom);
  renderChordLabels(document.getElementById('topLabels'),groupsTop);
  renderChordLabels(document.getElementById('bottomLabels'),groupsBottom);
  document.getElementById('btnUp').classList.toggle('active',rootAlter===1);
  document.getElementById('btnDown').classList.toggle('active',rootAlter===-1);
  document.getElementById('btnRight').classList.toggle('active',selectedMode==='major');
  document.getElementById('btnLeft').classList.toggle('active',selectedMode==='minor');
  document.getElementById('btnPractical').classList.toggle('active',practicalSpelling);
}
makeBar(document.getElementById('topBar'),groupsTop);makeBar(document.getElementById('bottomBar'),groupsBottom);render();
function fit(){const w=window.innerWidth;const cell=Math.max(17,Math.min(26,(w-16)/(7*2.15)));document.documentElement.style.setProperty('--cell',`${cell}px`);document.documentElement.style.setProperty('--font',`${Math.max(12,Math.min(18,cell*.72))}px`)}fit();window.addEventListener('resize',fit);
function applyDirection(dir){
  if(dir==='up'){
    rootAlter = rootAlter === -1 ? 0 : 1;
  }else if(dir==='down'){
    rootAlter = rootAlter === 1 ? 0 : -1;
  }else if(dir==='left'){
    selectedMode='minor';
  }else if(dir==='right'){
    selectedMode='major';
  }
  render();
}
function resetControls(){ practicalSpelling=false; render(); }
// Screen-wide chord controls: left=minor, right=major, up=sharpen every chord root, down=flatten every chord root.
let swipe=null;
document.addEventListener('pointerdown',e=>{
  swipe={x:e.clientX,y:e.clientY,t:Date.now(),id:e.pointerId};
},{passive:true,capture:true});
document.addEventListener('pointerup',e=>{
  if(!swipe||swipe.id!==e.pointerId)return;
  const s=swipe;swipe=null;
  if(window.__triadDragging)return;
  const dx=e.clientX-s.x,dy=e.clientY-s.y;
  if(Date.now()-s.t>900||Math.max(Math.abs(dx),Math.abs(dy))<45)return;
  if(Math.abs(dy)>=Math.abs(dx)){
    applyDirection(dy<0?'up':'down');
  }else{
    applyDirection(dx<0?'left':'right');
  }
},{passive:true,capture:true});
document.getElementById('btnReset').addEventListener('click',e=>{e.stopPropagation();resetControls()});
const practicalButton=document.getElementById('btnPractical');
function activatePractical(e){e.preventDefault();e.stopPropagation();practicalSpelling=!practicalSpelling;render()}
practicalButton.addEventListener('click',activatePractical);
['Up','Right','Down','Left'].forEach(name=>{
  const btn=document.getElementById('btn'+name);
  btn.addEventListener('click',e=>{e.stopPropagation();applyDirection(name.toLowerCase())});
  btn.addEventListener('pointerdown',e=>e.stopPropagation());
  btn.addEventListener('pointerup',e=>e.stopPropagation());
});
// Press-and-hold any draggable object for 0.3 seconds to move it independently.
function enableDrag(wrap,delay,options={}){let timer=null,drag=false,pid=null,sx=0,sy=0,ox=0,oy=0;const centerX=!!options.centerX;function centeredLeft(el){return Math.max(0,(innerWidth-el.offsetWidth)/2)}wrap.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;pid=e.pointerId;sx=e.clientX;sy=e.clientY;const r=wrap.getBoundingClientRect();ox=r.left;oy=r.top;drag=false;timer=setTimeout(()=>{drag=true;window.__triadDragging=true;wrap.style.position='fixed';wrap.style.left=(centerX?centeredLeft(wrap):ox)+'px';wrap.style.top=oy+'px';wrap.style.right='auto';wrap.style.bottom='auto';wrap.style.width=`${r.width}px`;wrap.style.height='auto';wrap.style.zIndex='40';wrap.style.transform='none';wrap.setPointerCapture(pid)},delay)});wrap.addEventListener('pointermove',e=>{if(e.pointerId!==pid)return;if(!drag){if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8){clearTimeout(timer);timer=null}return}e.preventDefault();const x=centerX?centeredLeft(wrap):Math.max(0,Math.min(innerWidth-wrap.offsetWidth,ox+e.clientX-sx));const y=Math.max(0,Math.min(innerHeight-wrap.offsetHeight,oy+e.clientY-sy));wrap.style.left=x+'px';wrap.style.top=y+'px'});function end(e){if(e.pointerId!==pid)return;clearTimeout(timer);timer=null;if(drag&&centerX){wrap.style.left=centeredLeft(wrap)+'px'}if(drag){window.__triadDragging=false}drag=false;pid=null}wrap.addEventListener('pointerup',end);wrap.addEventListener('pointercancel',end);if(centerX){const recenter=()=>{if(wrap.style.position==='fixed'||wrap.id==='topWrap'||wrap.id==='bottomWrap'){wrap.style.left=centeredLeft(wrap)+'px'}};window.addEventListener('resize',recenter);setTimeout(recenter,0)}}
enableDrag(document.getElementById('topWrap'),300,{centerX:true});enableDrag(document.getElementById('bottomWrap'),300,{centerX:true});
// Circle hold-drag, matching the bars' 0.3-second hold.
const wheelWrap=document.querySelector('.key-wheel-wrap');enableDrag(wheelWrap,300);
</script></body></html>
