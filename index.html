<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101319"><title>Triad Bar</title>
<style>
:root{color-scheme:dark;--bg:#101319;--panel:#0d111a;--blue:#438bff;--fg:#f5f8ff;--cell:34px;--font:15px;--line:.5px;--pad:8px}

*{box-sizing:border-box}
html,body{touch-action:none;overscroll-behavior:none;margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
main{width:100%;height:100%;background:var(--bg)}

.key-wheel-wrap{display:none!important;position:fixed;z-index:30;left:50%;top:calc(50% - 86.25px);bottom:auto;transform:translateX(-50%);width:172.5px;display:flex;flex-direction:column;align-items:stretch;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
.key-wheel-wrap.dragging{cursor:grabbing}

.mode-indicator{display:none!important}

.bars-area{position:fixed;inset:0;z-index:10;pointer-events:none}
.bar-wrap{position:fixed;width:calc(100% - 16px);left:8px;right:auto;touch-action:none;pointer-events:auto;user-select:none;-webkit-user-select:none}
#bottomWrap{top:max(8px,calc(50% - 361px))}
.chord-labels{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));width:100%;height:30px;align-items:center;margin-bottom:2px;color:#6cc4ff;font-size:var(--font);font-weight:500;text-align:center;line-height:1}
.chord-label{display:block;min-width:0;width:100%;height:100%;position:relative;overflow:visible;white-space:nowrap}
.label-root-acc.angled{transform:translateY(-50%) rotate(-30deg)}
.label-root-acc{position:absolute;left:25%;top:50%;margin-left:0;transform:translateY(-50%);display:inline-flex;align-items:center;justify-content:flex-start;white-space:nowrap}
.label-root{display:inline-block;flex:0 0 auto;width:auto;text-align:left;line-height:1}
.label-acc{display:inline-block;line-height:1;margin-left:.02em}
.label-acc:empty{margin-left:0}
.label-suffix{display:inline-block;font-size:.9em;line-height:1;white-space:nowrap;margin-left:.03em}
.sus-word{font-size:calc(1em - 3px)}
.sus-num{line-height:1;font-size:calc(1em - 4px)}
.label-suffix.compact-altered-sus{font-size:.9em}
.triad-bar{display:grid;width:100%;background:linear-gradient(160deg,#171d2e 0%,#0d111d 100%);border:.75px solid var(--blue);border-right:1px solid var(--blue);grid-template-columns:repeat(var(--groups),minmax(0,1fr));}

.triad-group{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));min-width:0;border-right:.75px solid var(--blue)}
.triad-group:last-child{border-right:0}
.note-stack,.acc-stack{display:grid;grid-template-rows:repeat(3,var(--cell));min-width:0}
.note-stack{border-right:.75px solid var(--blue)}
.acc-stack{border-right:.5px solid var(--blue)}
.triad-cell{display:flex;align-items:center;justify-content:center;min-width:0;overflow:hidden;white-space:nowrap;font-size:var(--font);line-height:1;font-weight:500;border-bottom:.5px solid var(--blue);color:var(--fg);padding:0 1px}
.triad-cell:last-child{border-bottom:0}
.acc-stack .triad-cell{font-size:var(--font)}
.blank{color:transparent!important}
.double-accidental{color:#ff5a66!important}
@media(max-width:390px){.motion-indicator .formula-cell{font-size:calc(var(--font)*.8)!important}.bars-area{gap:14px}.triad-cell{padding:0}.acc-stack .triad-cell{font-size:var(--font)}}

.swipe-pad{position:fixed;right:18px;top:calc(50% - 70px);transform:none;width:174px;height:180px;display:grid;grid-template-columns:repeat(4,39px);grid-template-rows:repeat(4,39px);justify-content:center;align-content:center;column-gap:6px;row-gap:8px;z-index:35;pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none}

.swipe-btn{position:relative;justify-self:center;align-self:center;width:39px;height:39px;background:linear-gradient(145deg,rgba(120,162,255,.42) 0%,rgba(77,126,232,.16) 52%,rgba(53,102,200,.3) 100%);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);border:1px solid rgba(170,200,255,.45);border-radius:11px;padding:0;margin:0;outline:none;display:flex;align-items:center;justify-content:center;color:#fff;line-height:1;font-family:Arial,sans-serif;box-shadow:inset 2px 2px 4px #ffffff55,inset -3px -3px 5px #183d8d88,0 6px 10px #0008;transition:transform .08s,box-shadow .08s}

.swipe-btn:active{transform:translateY(3px);box-shadow:inset 2px 2px 4px #ffffff44,inset -2px -2px 4px #183d8d88,0 3px 6px #0008}

.swipe-btn.active,.swipe-btn.active:active{z-index:3;border-color:#438bff;box-shadow:inset 2px 2px 4px #ffffff33,inset -3px -3px 5px #183d8d88,0 0 0 2px #438bff,0 0 12px 2px #438bff99,0 7px 14px #0009}

.motion-indicator{position:absolute;left:calc(50% - var(--cell));top:calc(-3 * var(--cell) - 11px);width:calc(2 * var(--cell));height:calc(3 * var(--cell));display:grid;grid-template-columns:repeat(2,var(--cell));grid-template-rows:repeat(3,var(--cell));background:var(--panel);border:.75px solid var(--blue);border-radius:0;overflow:hidden;box-shadow:none;pointer-events:none}
.motion-cell{display:flex;align-items:center;justify-content:center;border-right:.5px solid var(--blue);border-bottom:.5px solid var(--blue);color:#fff;font-size:22px;font-weight:800;line-height:1;text-shadow:none;min-width:0;min-height:0}
.motion-square{display:inline-block;box-sizing:border-box;width:.7em;height:.14em;border:0;border-radius:0;background:#fff}
.motion-triangle-pair{display:inline-flex;align-items:center;justify-content:center;gap:0;max-width:100%;white-space:nowrap}
.motion-triangle{display:inline-block;font-size:22px;line-height:1;font-weight:900;transform:scaleX(.95);flex:0 0 auto;color:#fff}
.motion-cell.double-motion,.formula-cell.double-motion,.double-motion .motion-triangle{color:var(--blue)!important}
.motion-arrow-cell{grid-column:2;border-right:0}
.formula-cell{grid-column:1;font-family:inherit;font-size:calc(var(--font)*.86)!important;font-weight:500!important;line-height:1;border-right:.5px solid var(--blue)}
.motion-cell[style*="grid-row:3"]{border-bottom:0}
.motion-middle{font-size:21px}
.swipe-btn.sus2{grid-column:3;grid-row:4}
.swipe-btn.sus4{grid-column:1;grid-row:1}
.swipe-btn.aug{grid-column:2;grid-row:1}
.swipe-btn.dim{grid-column:3;grid-row:3}
.swipe-btn .btn-label{position:relative;z-index:1;display:block;text-align:center;color:#fff;font-size:15px;font-weight:800;line-height:1;letter-spacing:0;white-space:nowrap;pointer-events:none;text-shadow:0 2px 2px #16336bcc}

.swipe-btn.up{left:auto;right:auto;top:auto;bottom:auto;grid-column:2;grid-row:2}

.swipe-btn.down{left:auto;right:auto;top:auto;bottom:auto;grid-column:2;grid-row:3}

.swipe-btn.left{left:auto;right:auto;top:auto;bottom:auto;grid-column:3;grid-row:2}

.swipe-btn.right{left:auto;right:auto;top:auto;bottom:auto;grid-column:1;grid-row:2}

.reset-btn{position:relative;left:0;top:-3px;justify-self:center;align-self:center;grid-column:3;grid-row:4;width:33px;height:33px;border-radius:50%;border:1px solid rgba(170,200,255,.45);background:linear-gradient(145deg,rgba(100,140,210,.4),rgba(40,60,100,.22));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);color:#dce7ff;font-size:10px;font-weight:800;line-height:1;box-shadow:inset 2px 2px 4px #ffffff22,inset -3px -3px 5px #0008,0 3px 0 #080d17,0 5px 9px #0008;cursor:pointer}

.practical-btn{z-index:50;pointer-events:auto;touch-action:manipulation;position:relative;left:-39px;top:-3px;justify-self:center;align-self:center;grid-column:3;grid-row:4;width:33px;height:33px;border-radius:50%;border:1px solid rgba(170,200,255,.45);background:linear-gradient(145deg,rgba(100,140,210,.4),rgba(40,60,100,.22));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);color:#dce7ff;font-size:10px;font-weight:800;line-height:1;box-shadow:inset 2px 2px 4px #ffffff22,inset -3px -3px 5px #0008,0 3px 0 #080d17,0 5px 9px #0008;cursor:pointer}
.practical-btn.active{border-color:#438bff;box-shadow:inset 2px 2px 4px #ffffff44,inset -3px -3px 5px #0008,0 0 0 2px #438bff,0 0 12px 2px #438bff99}
.practical-btn:active{transform:translateY(2px)}

.set-btn{position:relative;left:39px;top:-3px;justify-self:center;align-self:center;grid-column:3;grid-row:4;width:33px;height:33px;border-radius:50%;border:1px solid rgba(170,200,255,.45);background:linear-gradient(145deg,rgba(100,140,210,.4),rgba(40,60,100,.22));-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);color:#dce7ff;font-size:16px;font-weight:800;line-height:1;box-shadow:inset 2px 2px 4px #ffffff22,inset -3px -3px 5px #0008,0 3px 0 #080d17,0 5px 9px #0008;cursor:pointer}

.reset-btn:active,.set-btn:active{transform:translateY(2px);box-shadow:inset 2px 2px 4px #ffffff18,inset -2px -2px 4px #0008,0 1px 0 #080d17,0 3px 6px #0008}

/* CoF wheel and chart drag handle. Keep the wheel at its original 172.5px canvas size. */
.key-wheel-wrap{display:flex!important;width:172.5px;height:172.5px;position:fixed;z-index:30;left:50%;top:calc(50% - 86.25px);bottom:auto;transform:translateX(-50%);align-items:stretch;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab;filter:drop-shadow(0 9px 15px #000b)}

.key-wheel-wrap.dragging,.swipe-pad.dragging{cursor:grabbing}

.motion-indicator{pointer-events:auto;cursor:grab}

.swipe-pad{cursor:grab}

/* Flat wheel layout: the wheel, formula, and controls occupy separate columns. */
.key-wheel-wrap{width:224.25px;height:224.25px;left:18px;top:calc(50% - 148.6px);transform:none;filter:drop-shadow(0 12px 18px #000b)}

.motion-indicator{position:fixed;left:calc(50% + 91.7px);top:calc(50% - 124px);z-index:26;pointer-events:auto;cursor:grab}

/* Default layout: bar on top, wheel left, formula box right of the wheel, button pad centred below the wheel. */
.swipe-pad{left:calc(50% - 60px);right:auto;top:calc(50% + 120px)}
/* Circle buttons stacked vertically to the right of the pad, 8px apart and 6px from the buttons (same gaps as the pad grid). */
.swipe-pad{width:129px;grid-template-columns:repeat(3,39px);justify-content:start}
.practical-btn,.reset-btn,.set-btn{position:absolute;left:180px;grid-column:auto;grid-row:auto;justify-self:auto;align-self:auto}
.practical-btn{top:3px}
.reset-btn{top:50px}
.set-btn{top:97px}
/* Bigger, bolder symbols on the circle buttons */
.reset-btn{font-size:22px;font-weight:900;color:#fff;padding:0;text-shadow:0 1px 2px #16336bcc}
.set-btn{font-size:22px;font-weight:900;color:#fff;padding:0;text-shadow:0 1px 2px #16336bcc}
.practical-btn{font-size:26px;font-weight:900;color:#fff;padding:0;text-shadow:0 1px 2px #16336bcc}
/* M, m, b, # symbols sized to match the circle-button symbols */
.swipe-btn.up .btn-label,.swipe-btn.down .btn-label,.swipe-btn.left .btn-label,.swipe-btn.right .btn-label{font-size:22px;font-weight:900}
/* Row colour groups: top (sus4, aug) violet, middle (#, M, b) original blue glass, bottom (m, dim, sus2) teal. */
.swipe-btn.sus4,.swipe-btn.aug{background:linear-gradient(145deg,rgba(190,140,255,.42) 0%,rgba(140,90,230,.16) 52%,rgba(110,60,200,.3) 100%)}
.swipe-btn.sus4:not(.active),.swipe-btn.aug:not(.active){border-color:rgba(215,185,255,.45);box-shadow:inset 2px 2px 4px #ffffff55,inset -3px -3px 5px #4a208d88,0 6px 10px #0008}
.swipe-btn.sus4:not(.active):active,.swipe-btn.aug:not(.active):active{box-shadow:inset 2px 2px 4px #ffffff44,inset -2px -2px 4px #4a208d88,0 3px 6px #0008}
.swipe-btn.down,.swipe-btn.dim,.swipe-btn.sus2{background:linear-gradient(145deg,rgba(90,215,185,.4) 0%,rgba(50,170,150,.16) 52%,rgba(30,140,125,.3) 100%)}
.swipe-btn.down:not(.active),.swipe-btn.dim:not(.active),.swipe-btn.sus2:not(.active){border-color:rgba(160,240,220,.45);box-shadow:inset 2px 2px 4px #ffffff55,inset -3px -3px 5px #0f5a5088,0 6px 10px #0008}
.swipe-btn.down:not(.active):active,.swipe-btn.dim:not(.active):active,.swipe-btn.sus2:not(.active):active{box-shadow:inset 2px 2px 4px #ffffff44,inset -2px -2px 4px #0f5a5088,0 3px 6px #0008}
/* No text selection, carets, callout menus or magnifier loupes anywhere */
html,body,body *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;caret-color:transparent}

::selection{background:transparent}

::-moz-selection{background:transparent}
/* Two-ring circle of fifths: major keys outside, relative minors inside. */
.wheel-disc{position:relative;width:100%;height:100%;display:block;border-radius:50%;background:#111419;flex:none;overflow:visible}
#keyWheel{position:relative;width:100%;height:100%;display:block;overflow:visible}
.wheel-base{fill:#111419;stroke:#2a2c32;stroke-width:.25}
.wheel-sector{cursor:pointer;stroke:#0a0b0d;stroke-width:.26;stroke-linejoin:round}
.wheel-label{paint-order:stroke;stroke:rgba(0,0,0,.4);stroke-width:.5px;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.wheel-label.outer{font-size:6.1px}.wheel-label.inner{font-size:4.9px}
.wheel-center{fill:url(#wheelCenterGradient);stroke:#08090b;stroke-width:.5}
.wheel-center-ring{fill:none;stroke:#d6544a;stroke-width:.5;pointer-events:none}
.wheel-center-label{fill:#ca4f45;font-weight:800;text-anchor:middle;dominant-baseline:central;pointer-events:none}
/* Vertical triad note bar: one block per chord, root label (underlined) with its three notes on one line below. Hold to move. */
.note-bar{--chord-accent:#6cc4ff;position:fixed;left:8px;bottom:8px;top:auto;width:max-content!important;height:auto!important;z-index:12;display:flex;flex-direction:column;padding:4px 7px;border:1px solid rgba(67,139,255,.8);border-radius:14px;background:linear-gradient(160deg,#171d2e 0%,#0d111d 100%);box-shadow:0 8px 16px #0009;touch-action:none;pointer-events:auto;cursor:grab;user-select:none;-webkit-user-select:none}
.note-bar.dragging{cursor:grabbing;box-shadow:0 12px 22px #000b}
.note-chord{display:flex;flex-direction:column;align-items:center;gap:2px;padding:2px 0;min-width:0}
.note-chord+.note-chord{border-top:.5px solid rgba(67,139,255,.28)}
.note-root{display:inline-block;font-size:calc(var(--font) + 3px);font-weight:800;line-height:1;color:var(--chord-accent);white-space:nowrap;padding-bottom:2px;border-bottom:2px solid var(--chord-accent)}
.note-col{display:flex;flex-direction:column;align-items:center;gap:2px}
.note-deg{font-size:calc(var(--font)*.7);font-weight:600;line-height:1;color:var(--fg);opacity:.65}
.note-list{display:flex;justify-content:center;gap:5px;font-size:var(--font);font-weight:500;line-height:1;color:var(--fg);white-space:nowrap}
/* The three circle buttons (≈, reset, 4) are their own stack, separate from the triad buttons. Hold to move. */
.circle-stack{position:fixed;left:calc(50% + 120px);top:calc(50% + 123px);width:33px;z-index:36;display:flex;flex-direction:column;align-items:center;gap:14px;touch-action:none;pointer-events:auto;cursor:grab;user-select:none;-webkit-user-select:none}
.circle-stack.dragging{cursor:grabbing}
.circle-stack .practical-btn,.circle-stack .reset-btn,.circle-stack .set-btn{position:relative;left:0;top:0;flex:none;grid-column:auto;grid-row:auto;justify-self:auto;align-self:auto}
</style></head>
<body><main>
<div class="key-wheel-wrap" aria-label="Circle of fifths key selector"><div class="wheel-disc"><svg id="keyWheel" viewBox="0 0 100 100" role="img" aria-label="Choose a key"></svg></div><div id="modeIndicator" class="mode-indicator" aria-hidden="true"></div></div>
<div class="bars-area" id="barsArea"><div class="bar-wrap" id="bottomWrap"><div class="chord-labels" id="bottomLabels" aria-label="Bottom chord labels"></div><div class="triad-bar" id="bottomBar" aria-label="Bottom triad row"></div></div></div>
<div class="note-bar" id="noteBar" aria-label="Triad notes"></div>
<div class="motion-indicator" id="motionIndicator" aria-label="Triad formula">
  <div class="motion-cell motion-arrow-cell" id="motionRoot" style="grid-column:2;grid-row:1"></div>
  <div class="motion-cell motion-middle motion-arrow-cell" id="motionThird" style="grid-column:2;grid-row:2"></div>
  <div class="motion-cell motion-arrow-cell" id="motionFifth" style="grid-column:2;grid-row:3"></div>
  <div class="motion-cell formula-cell" id="motionRootLabel" style="grid-column:1;grid-row:1">R</div>
  <div class="motion-cell formula-cell" id="motionThirdLabel" style="grid-column:1;grid-row:2">3</div>
  <div class="motion-cell formula-cell" id="motionFifthLabel" style="grid-column:1;grid-row:3">5</div>
</div><div class="swipe-pad" aria-label="Chord quality and spelling controls">
<button class="swipe-btn left" id="btnLeft" aria-label="Flat"><span class="btn-label">b</span></button>
<button class="swipe-btn up" id="btnUp" aria-label="Major"><span class="btn-label">M</span></button>
<button class="swipe-btn right" id="btnRight" aria-label="Sharp"><span class="btn-label">#</span></button>
<button class="swipe-btn sus2" id="btnSus2" aria-label="Suspended second"><span class="btn-label">sus2</span></button>
<button class="swipe-btn down" id="btnDown" aria-label="Minor"><span class="btn-label">m</span></button>
<button class="swipe-btn sus4" id="btnSus4" aria-label="Suspended fourth"><span class="btn-label">sus4</span></button>
<button class="swipe-btn aug" id="btnAug" aria-label="Augmented"><span class="btn-label">aug</span></button>
<button class="swipe-btn dim" id="btnDim" aria-label="Diminished"><span class="btn-label">dim</span></button>
</div>
<div class="circle-stack" id="circleStack" aria-label="Spelling, reset and triad set buttons">
<button class="practical-btn" id="btnPractical" aria-label="Practical chord spelling">≈</button>
<button class="reset-btn" id="btnReset" aria-label="Reset">↻</button>
<button class="set-btn" id="btnSet" aria-label="Triad set: circle of fourths"><span id="btnSetLabel">4</span></button>
</div></main>
<script>
let showAltTriads=false; // tap the triad bar to flip between the two chord sets
const fifths=['C','G','D','A','E','B','F♯','D♭','A♭','E♭','B♭','F'];let selectedKey='C',selectedMode='major',isMinor=false; // isMinor is an independent modifier that combines with aug / sus2 / sus4
const groupsTop=[['F','A','C'],['C','E','G'],['G','B','D'],['D','F','A'],['A','C','E'],['E','G','B'],['B','D','F']];const groupsBottom=[['G','B','D'],['C','E','G'],['F','A','C'],['B','D','F'],['E','G','B'],['A','C','E'],['D','F','A']];

function accidentalValue(acc){
  if(!acc) return 0;
  return [...acc].reduce((sum,ch)=>sum+(ch==='♯'?1:ch==='♭'?-1:ch==='𝄪'?2:ch==='𝄫'?-2:0),0);
}
function accidentalText(value){
  return value===2?'𝄪':value===1?'♯':value===-1?'♭':value===-2?'𝄫':value>2?'♯'.repeat(value):value< -2?'♭'.repeat(-value):'';
}
const naturalPitch={C:0,D:2,E:4,F:5,G:7,A:9,B:11};
let rootAlter=0; // 0 natural, +1 sharp, -1 flat
let practicalSpelling=false;
function normalizeAccidental(value){
  // Return the smallest signed semitone alteration (-6 to +6).
  // Do not wrap values such as +3 back into an invalid +3/-9 oscillation.
  let v=((value%12)+12)%12;
  if(v>6)v-=12;
  return v;
}
function triadIntervals(){
  if(selectedMode==='diminished') return [0,3,6];
  if(selectedMode==='sus2') return [0,2,7];
  if(selectedMode==='sus4') return [0,5,7];
  if(selectedMode==='augmented') return isMinor?[0,3,8]:[0,4,8];
  return isMinor?[0,3,7]:[0,4,7];
}
function letterSteps(){
  if(selectedMode==='sus2') return [0,1,4]; // 3rd is replaced by the 2nd
  if(selectedMode==='sus4') return [0,3,4]; // 3rd is replaced by the 4th
  // Letter distance of root/middle/fifth: sus2 uses the 2nd, sus4 the 4th.
  return [0,2,4];
}
function practicalTriad(notes){
  // Preserve the actual root pitch and chord quality, but choose the
  // clearest enharmonic spelling for the root, major/minor third, and fifth.
  const rootPitch=(naturalPitch[notes[0]]+rootAlter+120)%12;
  const intervals=triadIntervals();
  const letters=['C','D','E','F','G','A','B'];
  const chordLetterSteps=letterSteps();
  const candidates=[];

  for(const letter of letters){
    const li=letters.indexOf(letter);
    const rootAcc=normalizeAccidental(rootPitch-naturalPitch[letter]);

    const tones=chordLetterSteps.map((step,i)=>{
      const toneLetter=letters[(li+step)%7];
      const targetPitch=(rootPitch+intervals[i])%12;
      const acc=normalizeAccidental(targetPitch-naturalPitch[toneLetter]);
      return {letter:toneLetter,acc};
    });

    const allAccidentals=[rootAcc,...tones.map(t=>t.acc)];
    const cost=allAccidentals.reduce((sum,acc)=>sum+Math.abs(acc),0);

    // If two spellings are equally simple, retain the original root letter.
    // This keeps F# as F# rather than arbitrarily changing it to Gb.
    const originalLetterPenalty=letter===notes[0]?0:1;

    // As a final tie-break, follow the user's selected sharp/flat direction.
    const directionPenalty=
      rootAlter>0&&rootAcc<0 ? 1 :
      rootAlter<0&&rootAcc>0 ? 1 : 0;

    candidates.push({
      letter,
      rootAcc,
      tones,
      cost,
      originalLetterPenalty,
      directionPenalty
    });
  }

  candidates.sort((a,b)=>
    a.cost-b.cost ||
    a.originalLetterPenalty-b.originalLetterPenalty ||
    a.directionPenalty-b.directionPenalty ||
    a.letter.localeCompare(b.letter)
  );

  const best=candidates[0];

// Press-and-hold any draggable object for 0.3 seconds to move it independently.
function enableDrag(wrap,delay,options={}){
  let timer=null,drag=false,pid=null,sx=0,sy=0,ox=0,oy=0,suppressClick=false;
  const centerX=!!options.centerX;
  const capture=!!options.capture;
  function centeredLeft(el){return Math.max(0,(innerWidth-el.offsetWidth)/2)}
  wrap.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(options.blocked&&options.blocked())return;
    clearTimeout(timer); // a second finger must not leave the first finger's hold timer running
    if(drag){wrap.classList.remove('dragging');window.__triadDragging=false;drag=false} // ...nor a half-finished drag flag
    pid=e.pointerId;sx=e.clientX;sy=e.clientY;
    const r=wrap.getBoundingClientRect();ox=r.left;oy=r.top;drag=false;
    timer=setTimeout(()=>{
      if(options.blocked&&options.blocked())return;
      if(window.__activePointers&&!window.__activePointers.has(pid))return; // already released: not a hold
      drag=true;window.__triadDragging=true;wrap.dataset.moved='1';
      wrap.classList.add('dragging');
      if(options.preventClickAfterDrag)suppressClick=true;
      wrap.style.position='fixed';
      wrap.style.left=(centerX?centeredLeft(wrap):ox)+'px';
      wrap.style.top=oy+'px';wrap.style.right='auto';wrap.style.bottom='auto';
      wrap.style.width=`${r.width}px`;wrap.style.height=`${r.height}px`;
      wrap.style.zIndex='40';wrap.style.transform='none';
      try{wrap.setPointerCapture(pid)}catch(_){}
    },delay);
  },capture);
  wrap.addEventListener('pointermove',e=>{
    if(e.pointerId!==pid)return;
    if(!drag){
      if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8){clearTimeout(timer);timer=null}
      return;
    }
    e.preventDefault();
    const x=centerX?centeredLeft(wrap):Math.max(0,Math.min(innerWidth-wrap.offsetWidth,ox+e.clientX-sx));
    const y=Math.max(0,Math.min(innerHeight-wrap.offsetHeight,oy+e.clientY-sy));
    wrap.style.left=x+'px';wrap.style.top=y+'px';
  },capture);
  function end(e){
    if(e.pointerId!==pid)return;
    clearTimeout(timer);timer=null;
    if(drag&&centerX)wrap.style.left=centeredLeft(wrap)+'px';
    if(drag)window.__triadDragging=false;
    if(drag)wrap.classList.remove('dragging');
    drag=false;pid=null;
  }
  wrap.addEventListener('pointerup',end,capture);
  wrap.addEventListener('pointercancel',end,capture);
  if(options.preventClickAfterDrag){
    wrap.addEventListener('click',e=>{
      if(!suppressClick)return;
      e.preventDefault();e.stopPropagation();suppressClick=false;
    },true);
  }
  if(centerX){
    const recenter=()=>{
      if(wrap.style.position==='fixed'||wrap.id==='bottomWrap'){
        wrap.style.left=centeredLeft(wrap)+'px';
      }
    };
    window.addEventListener('resize',recenter);setTimeout(recenter,0);
  }
  // Abort a pending or active hold-drag (used when a second finger turns the touch into a pinch).
  function cancel(){
    clearTimeout(timer);timer=null;
    if(drag){wrap.classList.remove('dragging');window.__triadDragging=false}
    drag=false;pid=null;
  }
  (window.__dragCancels=window.__dragCancels||[]).push(cancel);
  return {cancel};
}
enableDrag(document.getElementById('bottomWrap'),300,{centerX:true,preventClickAfterDrag:true});
// The vertical note bar moves independently: press and hold 0.3 seconds, then drag.

// Move the complete arrow/reset/practical control cluster after a stationary 0.5-second hold.
const swipePad=document.querySelector('.swipe-pad');
enableDrag(swipePad,500,{capture:true,preventClickAfterDrag:true});

// Circle hold-drag after a stationary half-second hold.
const wheelWrap=document.querySelector('.key-wheel-wrap');window.__wheelPinch=false;
const wheelDrag=enableDrag(wheelWrap,500,{preventClickAfterDrag:true,blocked:()=>window.__wheelPinch});
// Pinch or spread two fingers on the circle of fifths to resize it: never smaller than its
// default size, never more than 30% larger. It scales around its own centre.
(function(){
  const BASE=172.5,MIN_SCALE=1,MAX_SCALE=1.3;
  const pts=new Map();
  window.__clearWheelPointers=()=>pts.clear();
  let startDist=1,startScale=1,suppressClickUntil=0;
  const spread=()=>{const [a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
  function setWheelSize(next){
    next=Math.max(MIN_SCALE,Math.min(MAX_SCALE,next));
    if(next===wheelScale)return;
    const r=wheelWrap.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,size=BASE*next;
    const left=Math.max(0,Math.min(innerWidth-size,cx-size/2)),top=Math.max(0,Math.min(innerHeight-size,cy-size/2));
    wheelWrap.dataset.moved='1';
    Object.assign(wheelWrap.style,{position:'fixed',left:left+'px',top:top+'px',right:'auto',bottom:'auto',transform:'none',width:size+'px',height:size+'px'});
    wheelScale=next;
  }
  // Registered after enableDrag, so a second finger cancels the hold-drag that the first finger started.
  wheelWrap.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse')return;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){
      wheelDrag.cancel();
      window.__wheelPinch=true;window.__triadDragging=true; // also keeps the screen-wide swipe handler quiet
      startDist=Math.max(1,spread());startScale=wheelScale;
      pts.forEach((_,id)=>{try{wheelWrap.setPointerCapture(id)}catch(_){}});
    }
  });
  wheelWrap.addEventListener('pointermove',e=>{
    const p=pts.get(e.pointerId);if(!p)return;
    p.x=e.clientX;p.y=e.clientY;
    if(window.__wheelPinch&&pts.size>=2){e.preventDefault();setWheelSize(startScale*spread()/startDist)}
  });
  function release(e){
    if(!pts.delete(e.pointerId))return;
    if(pts.size===0&&window.__wheelPinch){
      window.__wheelPinch=false;window.__triadDragging=false;
      suppressClickUntil=Date.now()+350; // a pinch must never count as a tap on a key
    }
  }
  wheelWrap.addEventListener('pointerup',release);
  wheelWrap.addEventListener('pointercancel',release);
  wheelWrap.addEventListener('click',e=>{
    if(Date.now()<suppressClickUntil){e.preventDefault();e.stopPropagation()}
  },true);
  // Trackpad pinch on desktop (ctrl+wheel) and Safari's own gesture events.
  wheelWrap.addEventListener('wheel',e=>{
    if(!e.ctrlKey)return;
    e.preventDefault();setWheelSize(wheelScale*Math.exp(-e.deltaY*0.01));
  },{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(t=>wheelWrap.addEventListener(t,e=>e.preventDefault()));
})();
// Never allow text selection (which is what triggers iOS cursors, handles and the magnifier).
['selectstart','contextmenu','dragstart'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{capture:true,passive:false}));
document.addEventListener('selectionchange',()=>{const sel=window.getSelection&&window.getSelection();if(sel&&sel.rangeCount)sel.removeAllRanges()});
// ---- Default layout: no item may sit on top of another, at load, on refresh and on resize. ----
// Each item has an ideal spot (the arrangement from the screenshot: wheel under the bar, formula beside it, note bar
// under the wheel, buttons bottom right). If the ideal spot is free it is used; otherwise the nearest free spot is.
function packDefaultLayout(W,H,bar,items,fixed){
  const M=8,top=bar.y+bar.h+M,placed=[bar,...Object.values(fixed)],out={};
  const hit=(a,b,g)=>a.x<b.x+b.w+g&&b.x<a.x+a.w+g&&a.y<b.y+b.h+g&&b.y<a.y+a.h+g;
  const overlap=(a,b)=>Math.max(0,Math.min(a.x+a.w,b.x+b.w)-Math.max(a.x,b.x))*Math.max(0,Math.min(a.y+a.h,b.y+b.h)-Math.max(a.y,b.y));
  const ref=id=>out[id]||fixed[id];
  items.forEach(it=>{
    const ideal=it.ideal(ref,{W,H,M,top});
    const xs=[ideal.x,M,W-M-it.w],ys=[ideal.y,top,H-M-it.h];
    placed.forEach(r=>{xs.push(r.x,r.x+r.w+M,r.x+r.w-it.w,r.x-M-it.w);ys.push(r.y,r.y+r.h+M,r.y+r.h-it.h,r.y-M-it.h)});
    let best=null;
    for(const gap of [M,2,0]){
      xs.forEach(x=>ys.forEach(y=>{
        if(x<M-.01||y<top-.01||x+it.w>W-M+.01||y+it.h>H-M+.01)return;
        const c={x,y,w:it.w,h:it.h};
        if(placed.some(r=>hit(c,r,gap)))return;
        const d=Math.hypot(x-ideal.x,y-ideal.y);
        if(!best||d<best.d)best={x,y,d};
      }));
      if(best)break;
    }
    if(!best){ // the screen is too small for everything: least overlap, kept on screen
      let least=Infinity;
      xs.forEach(x=>ys.forEach(y=>{
        const cx=Math.max(M,Math.min(W-M-it.w,x)),cy=Math.max(top,Math.min(H-M-it.h,y)),c={x:cx,y:cy,w:it.w,h:it.h};
        const score=placed.reduce((t,r)=>t+overlap(c,r),0)*1000+Math.hypot(cx-ideal.x,cy-ideal.y);
        if(score<least){least=score;best={x:cx,y:cy}}
      }));
    }
    out[it.id]={x:best.x,y:best.y,w:it.w,h:it.h};placed.push(out[it.id]);
  });
  return out;
}
function applyDefaultLayout(){
  const G=14,q=id=>document.getElementById(id);
  const els={wheel:document.querySelector('.key-wheel-wrap'),note:q('noteBar'),formula:q('motionIndicator'),pad:document.querySelector('.swipe-pad'),stack:q('circleStack')};
  if(Object.values(els).some(e=>!e))return;
  const rect=el=>{const r=el.getBoundingClientRect();return{x:r.left,y:r.top,w:r.width,h:r.height}};
  const size=el=>({w:el.offsetWidth,h:el.offsetHeight});
  const ideals={
    wheel:(ref,c)=>({x:c.M,y:c.top}),
    note:(ref,c)=>{const w=ref('wheel');return{x:c.M,y:w.y+w.h+c.M}},
    formula:(ref,c)=>{const w=ref('wheel');return{x:w.x+w.w+c.M,y:w.y}},
    pad:(ref,c)=>({x:c.W-c.M-els.stack.offsetWidth-G-els.pad.offsetWidth,y:c.H-c.M-els.pad.offsetHeight}),
    stack:(ref,c)=>{const p=ref('pad');return{x:p.x+p.w+G,y:p.y+3}}
  };
  const items=[],fixed={};
  ['wheel','note','formula','pad','stack'].forEach(id=>{
    if(els[id].dataset.moved)fixed[id]=rect(els[id]);
    else items.push({id,...size(els[id]),ideal:ideals[id]});
  });
  const out=packDefaultLayout(innerWidth,innerHeight,rect(q('bottomWrap')),items,fixed);
  Object.entries(out).forEach(([id,r])=>{
    Object.assign(els[id].style,{position:'fixed',left:r.x+'px',top:r.y+'px',right:'auto',bottom:'auto',transform:'none'});
  });
}
applyDefaultLayout();
window.addEventListener('load',applyDefaultLayout);
window.addEventListener('resize',()=>requestAnimationFrame(applyDefaultLayout));
window.addEventListener('orientationchange',()=>setTimeout(applyDefaultLayout,250));
